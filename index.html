<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crackit test builds</title>
<style>
  :root { --bg: #14172b; --card: #1f2440; --text: #f4f1ec; --muted: #9ba3be; --accent: #ffb23e; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.game { display: block; background: var(--card); color: var(--text); text-decoration: none; padding: 18px 20px; border-radius: 16px; margin-bottom: 12px; border: 1px solid #2f365e; }
  a.game strong { color: var(--accent); font-size: 20px; }
  a.game span { display: block; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Crackit</h1>
  <p>Test builds. Not public yet.</p>
  <a class="game" href="fire-ice/"><strong>Fire &amp; Ice</strong><span>Logic grid puzzle. Web test 1.2: sound on silent mode, 2x pixel cap, lower idle frame rate.</span></a>
</main>
</body>
</html>
