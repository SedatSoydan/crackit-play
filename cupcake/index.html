<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cupcake Check</title>
<style>
html,body{margin:0;height:100%;background:#fff4ea;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Cupcake Check, draft 2: cupcakes roll through a check window. Toss the ones
// the order names, box the rest. A new order every 10 cupcakes.
const W = 360, H = 640, LIVES = 3, PER_ORDER = 10, SPACING = 118, BELT_Y = 374, WIN_L = 128, WIN_R = 232, SPAWN_X = -40;
const BIN = [70, 488], BOX = [290, 488], ORDER_PAUSE = 1.8, CAKE = 1.38, COUNTER_Y = 474;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const Q = new URLSearchParams(location.search);
let rnd = mulberry(Q.get('seed') ? Number(Q.get('seed')) : (Date.now() % 1e9) | 0);
const TAU = Math.PI * 2;
const pick = a => a[Math.floor(rnd() * a.length)];

// ---------- rules
const FEATURES = { frost: ['pink', 'blue', 'white', 'choc'], top: ['cherry', 'star', 'none'], spr: ['yes', 'no'] };
const LABEL = { frost: { pink: 'pink frosting', blue: 'blue frosting', white: 'white frosting', choc: 'chocolate' },
  top: { cherry: 'a cherry', star: 'a star', none: 'no topping' }, spr: { yes: 'sprinkles', no: 'no sprinkles' } };
function atomHolds(a, item) { return item[a.f] === a.v; }
function condHolds(c, item) { return c.op === 'one' ? atomHolds(c.a, item) : c.op === 'and' ? atomHolds(c.a, item) && atomHolds(c.b, item) : atomHolds(c.a, item) || atomHolds(c.b, item); }
// Should this cupcake be tossed under the order?
function shouldToss(order, item) { const c = condHolds(order.cond, item); return order.act === 'toss' ? c : !c; }
function randomAtom(f) { return { f, v: pick(FEATURES[f]) }; }
function makeOrder(n) {
  const feats = Object.keys(FEATURES).sort(() => rnd() - .5);
  let cond;
  if (n <= 2) cond = { op: 'one', a: randomAtom(feats[0]) };
  else cond = { op: rnd() < .5 ? 'or' : 'and', a: randomAtom(feats[0]), b: randomAtom(feats[1]) };
  const act = n >= 5 && rnd() < .5 ? 'box' : 'toss';
  return { n, cond, act };
}
function orderText(o) {
  const c = o.cond, a = LABEL[c.a.f][c.a.v];
  const body = c.op === 'one' ? a : `${a} ${c.op} ${LABEL[c.b.f][c.b.v]}`;
  return (o.act === 'toss' ? 'TOSS: ' : 'BOX ONLY: ') + body;
}
// A cupcake; about half of each order's cupcakes must be tossed.
function makeItem(order) {
  const want = rnd() < .5;
  let item;
  for (let k = 0; k < 80; k++) {
    item = { frost: pick(FEATURES.frost), top: pick(FEATURES.top), spr: pick(FEATURES.spr), seed: rnd() * 1000 };
    if (shouldToss(order, item) === want) break;
  }
  return item;
}
// Why: "Toss it: it has pink frosting and no topping."
function reason(order, item) {
  const fs = order.cond.op === 'one' ? [order.cond.a.f] : [order.cond.a.f, order.cond.b.f];
  const has = fs.map(f => LABEL[f][item[f]]).join(' and ');
  return `${shouldToss(order, item) ? 'Toss' : 'Box'} it: it has ${has}.`;
}

// ---------- state
let state = 'intro', T = 0, el = 0, lives = LIVES, score = 0, best = 0, sorted = 0;
let order = null, orderNo = 0, spawned = 0, items = [], flying = [], orderAt = -9, why = '', whyAt = -9, beltX = 0, flash = { t: -9, ok: true };
try { best = Number(localStorage.getItem('cupcakecheck_best') || 0); } catch (e) { /* storage off */ }
function speed() { return Math.min(100, 38 + sorted * 1.6); }
function startRun() { state = 'play'; el = 0; lives = LIVES; score = 0; sorted = 0; orderNo = 0; items = []; flying = []; why = ''; nextOrder(); }
function nextOrder() { orderNo++; order = makeOrder(orderNo); spawned = 0; orderAt = el; }
function paused() { return el - orderAt < ORDER_PAUSE; }
// The cupcake being checked: the front one not yet sorted.
function front() { let f = null; for (const it of items) if (!f || it.x > f.x) f = it; return f; }

function update(dt) {
  if (state !== 'play') return;
  el += dt;
  for (const f of flying) f.u += dt / .45;
  flying = flying.filter(f => f.u < 1);
  if (paused()) return;
  const v = speed();
  beltX += v * dt;
  for (const it of items) it.x += v * dt;
  // Spawn the order's cupcakes, evenly spaced.
  const last = items.length ? Math.min(...items.map(i => i.x)) : 1e9;
  if (spawned < PER_ORDER && (items.length === 0 || last - SPAWN_X >= SPACING)) {
    items.push(Object.assign(makeItem(order), { x: SPAWN_X })); spawned++;
  }
  // A cupcake that leaves the window unsorted.
  const f = front();
  if (f && f.x > WIN_R + 6) { miss(f); if (state !== 'play') return; }
  // The order is done when its cupcakes are all sorted: a new order.
  if (spawned >= PER_ORDER && items.length === 0 && flying.length === 0) nextOrder();
}
function miss(f) {
  items = items.filter(i => i !== f);
  flying.push({ item: f, from: [f.x, BELT_Y], to: [W + 60, BELT_Y + 60], u: 0 });
  lose('Too late! ' + reason(order, f));
}
function sort(toss) {
  if (state !== 'play' || paused()) return;
  const f = front();
  if (!f) return;
  audio();
  items = items.filter(i => i !== f);
  flying.push({ item: f, from: [f.x, BELT_Y], to: toss ? BIN : BOX, u: 0 });
  sorted++;
  if (shouldToss(order, f) === toss) { score++; flash = { t: T, ok: true, toss }; sGood(toss); }
  else { flash = { t: T, ok: false, toss }; lose(reason(order, f)); }
}
function lose(r) {
  lives--; why = r; whyAt = T; sBad();
  if (lives <= 0) { state = 'over'; sEnd(); if (score > best) { best = score; try { localStorage.setItem('cupcakecheck_best', String(best)); } catch (e) { /* storage off */ } } }
}

// ---------- drawing helpers
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ell(x, y, rx, ry, col, rot = 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); ctx.fill(); }
function lin(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function starPath(x, y, r) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); }
const FROST = { pink: ['#ffc4da', '#f27aa6', '#d9558a'], blue: ['#bfe6ff', '#5fb0ea', '#3a8fd0'], white: ['#ffffff', '#e6e0ee', '#bdb4cc'], choc: ['#b07a56', '#7a4a2c', '#5a341c'] };
const SPRINKLE = ['#ff5a7a', '#ffd23f', '#5fc282', '#5fb0ea', '#b27cd8'];
function hash(n) { const x = Math.sin(n * 127.1 + 31.7) * 43758.5453; return x - Math.floor(x); }

// A cupcake standing on (x, y), s = size; part 'top' draws only the frosting.
function drawCupcake(it, x, y, s = 1, part = 'all') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (part !== 'top') {
    ell(0, 1, 21, 3.5, 'rgba(90,50,20,.22)');
    // Pleated paper cup with a rim.
    ctx.fillStyle = lin(-20, 0, 20, 0, [[0, '#d98f3a'], [.35, '#f8cf7c'], [.6, '#f2bb5e'], [1, '#c9802f']]);
    ctx.beginPath(); ctx.moveTo(-19, -24); ctx.lineTo(19, -24); ctx.lineTo(14.5, 0); ctx.quadraticCurveTo(0, 2.5, -14.5, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(150,85,25,.4)'; ctx.lineWidth = 1.2;
    for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(k * 5.4, -23); ctx.lineTo(k * 4, -.5); ctx.stroke(); }
    ctx.fillStyle = '#ffe1a6'; rrect(-20, -26, 40, 4, 2); ctx.fill();
  }
  // Frosting: a base ring and three swirls, each with a rim and a shine.
  const [c0, c1, c2] = FROST[it.frost];
  const tiers = [[0, -28, 24, 8.5], [0, -36, 21, 9.5], [-1, -45, 16, 8.5], [1, -53, 10, 7], [0, -59, 4.5, 4]];
  for (const [dx, dy, rx, ry] of tiers) {
    ell(dx, dy + 1.6, rx, ry, c2);
    ctx.fillStyle = lin(0, dy - ry, 0, dy + ry, [[0, c0], [1, c1]]); ctx.beginPath(); ctx.ellipse(dx, dy, rx, ry, 0, 0, TAU); ctx.fill();
  }
  ell(-8, -46, 5.5, 2.6, 'rgba(255,255,255,.55)', -.35); ell(-10, -36, 4, 1.8, 'rgba(255,255,255,.4)', -.2);
  if (it.spr === 'yes') {
    for (let k = 0; k < 16; k++) {
      const yy = -30 - hash(it.seed + k + 90) * 26, w = 20 * (1 - (-30 - yy) / 38);
      const xx = (hash(it.seed + k) * 2 - 1) * w, a = hash(it.seed + k + 50) * TAU;
      ctx.save(); ctx.translate(xx, yy); ctx.rotate(a); ctx.fillStyle = SPRINKLE[k % 5]; rrect(-2.8, -1, 5.6, 2, 1); ctx.fill(); ctx.restore();
    }
  }
  if (it.top === 'cherry') {
    ctx.strokeStyle = '#4f7a24'; ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(1, -67); ctx.quadraticCurveTo(4, -76, 10, -79); ctx.stroke(); ctx.lineCap = 'butt';
    ell(10, -79, 4, 2, '#6cc04f', -.6);
    ell(0, -65, 7.5, 7, '#b81f2a'); ell(-.6, -66, 6.5, 6, '#e8382f'); ell(-2.6, -68, 2.2, 1.6, 'rgba(255,255,255,.75)');
  } else if (it.top === 'star') {
    ctx.fillStyle = '#e8a812'; starPath(0, -67, 10.5); ctx.fill();
    ctx.fillStyle = '#ffd84a'; starPath(0, -68, 9); ctx.fill();
    ell(-2.5, -71, 2, 1.3, 'rgba(255,255,255,.7)', -.4);
  }
  ctx.restore();
}

// An order feature on a little plate, with its name below.
function atomIcon(a, x, y) {
  ell(x, y + 2, 25, 7, 'rgba(160,100,60,.18)');
  ell(x, y, 25, 7, '#ffffff'); ell(x, y - .8, 19, 4.6, '#f6eee6');
  const base = { frost: 'white', top: 'none', spr: 'no', seed: 7 };
  if (a.f === 'frost') drawCupcake(Object.assign(base, { frost: a.v }), x, y + 22, .78, 'top');
  else if (a.f === 'top') {
    drawCupcake(Object.assign(base, { top: a.v }), x, y + 22, .78, 'top');
    if (a.v === 'none') { ctx.strokeStyle = '#e0553f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y - 30, 9, 0, TAU); ctx.moveTo(x - 6.4, y - 36.4); ctx.lineTo(x + 6.4, y - 23.6); ctx.stroke(); }
  } else {
    drawCupcake(Object.assign(base, { spr: a.v, seed: 3 }), x, y + 22, .78, 'top');
    if (a.v === 'no') { ctx.strokeStyle = '#e0553f'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - 16, y - 30); ctx.lineTo(x + 16, y - 4); ctx.stroke(); ctx.lineCap = 'butt'; }
  }
  ctx.fillStyle = '#7a5236'; ctx.font = '700 11px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(LABEL[a.f][a.v], x, y + 22);
}

// The order: a ticket pinned to a rail, with a coloured label and the features.
function drawCard() {
  const y0 = 80, h = 112, fresh = el - orderAt < ORDER_PAUSE, pulse = fresh ? 1 + .035 * Math.sin(T * 12) : 1;
  const toss = order.act === 'toss';
  ctx.fillStyle = '#c98a5a'; ctx.fillRect(0, y0 - 2, W, 4);
  ctx.save(); ctx.translate(180, y0 + h / 2); ctx.scale(pulse, pulse); ctx.translate(-180, -(y0 + h / 2));
  ctx.fillStyle = 'rgba(120,70,40,.2)'; rrect(16, y0 + 7, 328, h, 12); ctx.fill();
  ctx.fillStyle = lin(0, y0, 0, y0 + h, [[0, '#fffefa'], [1, '#fff4e4']]); rrect(16, y0 + 3, 328, h, 12); ctx.fill();
  ctx.strokeStyle = fresh ? '#ff9a2a' : 'rgba(200,140,90,.45)'; ctx.lineWidth = fresh ? 3 : 1.2; ctx.stroke();
  // A clip at the top and a dashed tear line.
  ctx.fillStyle = '#9aa0ac'; rrect(166, y0 - 6, 28, 14, 4); ctx.fill(); ctx.fillStyle = '#c3c8d2'; rrect(170, y0 - 4, 20, 5, 2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,140,90,.35)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(24, y0 + 30); ctx.lineTo(336, y0 + 30); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#b07a4a'; ctx.font = '800 11px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`ORDER #${orderNo}`, 28, y0 + 22);
  ctx.textAlign = 'right'; ctx.fillStyle = '#c9a080'; ctx.fillText(toss ? 'everything else: BOX' : 'everything else: TOSS', 332, y0 + 22);
  // The verb pill.
  const pill = toss ? ['#f27a63', '#c9503f', 'TOSS'] : ['#5fc282', '#3f9e62', 'BOX ONLY'];
  const pw = toss ? 74 : 98;
  ctx.fillStyle = pill[1]; rrect(26, y0 + 50, pw, 34, 17); ctx.fill();
  ctx.fillStyle = pill[0]; rrect(26, y0 + 47, pw, 34, 17); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '900 16px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pill[2], 26 + pw / 2, y0 + 69);
  const c = order.cond, left = 26 + pw, mid = (left + 340) / 2;
  if (c.op === 'one') atomIcon(c.a, mid, y0 + 80);
  else {
    atomIcon(c.a, mid - 58, y0 + 80); atomIcon(c.b, mid + 58, y0 + 80);
    ctx.fillStyle = c.op === 'or' ? '#ffcf5a' : '#9fc8ff'; rrect(mid - 21, y0 + 52, 42, 22, 11); ctx.fill();
    ctx.fillStyle = '#5a3a1e'; ctx.font = '900 12px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText(c.op.toUpperCase(), mid, y0 + 67);
  }
  ctx.restore();
}

function drawFactory() {
  // A bakery kitchen: wall, a shelf with jars, mint tiles, bunting.
  ctx.fillStyle = lin(0, 192, 0, 330, [[0, '#fff3e4'], [1, '#ffe8d0']]); ctx.fillRect(0, 192, W, 140);
  ctx.fillStyle = 'rgba(255,190,150,.25)';
  for (let y = 206; y < 330; y += 22) for (let x = (y / 22 % 2) * 11; x < W; x += 22) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#d8f1e6'; ctx.fillRect(0, 330, W, COUNTER_Y - 330);
  ctx.strokeStyle = 'rgba(140,200,175,.6)'; ctx.lineWidth = 1;
  for (let y = 330; y < COUNTER_Y; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let x = 0; x < W; x += 18) { ctx.beginPath(); ctx.moveTo(x, 330); ctx.lineTo(x, COUNTER_Y); ctx.stroke(); }
  ctx.fillStyle = '#e9c49a'; ctx.fillRect(0, 326, W, 5);
  // The shelf.
  ctx.fillStyle = 'rgba(120,70,40,.15)'; ctx.fillRect(0, 262, W, 6);
  ctx.fillStyle = lin(0, 254, 0, 262, [[0, '#d9a066'], [1, '#b8834c']]); ctx.fillRect(0, 254, W, 8);
  for (const [x, col, hgt] of [[30, '#ffd1dc', 30], [62, '#d4f0ff', 24], [254, '#fff0b8', 28], [288, '#e0d4ff', 22]]) {
    ctx.fillStyle = 'rgba(255,255,255,.7)'; rrect(x - 12, 254 - hgt, 24, hgt, 5); ctx.fill();
    ctx.fillStyle = col; rrect(x - 10, 254 - hgt * .65, 20, hgt * .6, 4); ctx.fill();
    ctx.fillStyle = '#c98a5a'; rrect(x - 13, 254 - hgt - 5, 26, 6, 3); ctx.fill();
    ell(x - 5, 254 - hgt * .7, 2, 5, 'rgba(255,255,255,.6)');
  }
  // A little plant on the shelf.
  ctx.fillStyle = '#e07a52'; rrect(320, 238, 22, 16, 3); ctx.fill();
  for (const [dx, a] of [[-6, -.6], [0, 0], [6, .6]]) ell(331 + dx, 230, 4, 10, '#5fb44c', a);
  // Bunting under the ticket rail.
  for (let k = 0; k < 10; k++) { const x = k * 40 + 4; ctx.fillStyle = ['#ff9eb5', '#ffd166', '#8fd3a8', '#9fc8ff'][k % 4]; ctx.beginPath(); ctx.moveTo(x, 196); ctx.lineTo(x + 32, 196); ctx.lineTo(x + 16, 214); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle = '#c98a5a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 196); ctx.lineTo(W, 196); ctx.stroke();
  // The counter.
  ctx.fillStyle = lin(0, COUNTER_Y, 0, COUNTER_Y + 12, [[0, '#e8b47c'], [1, '#c98a50']]); ctx.fillRect(0, COUNTER_Y, W, 12);
  ctx.fillStyle = lin(0, COUNTER_Y + 12, 0, 520, [[0, '#b8783f'], [1, '#9a6232']]); ctx.fillRect(0, COUNTER_Y + 12, W, 520 - COUNTER_Y - 12);
  ctx.strokeStyle = 'rgba(90,50,20,.25)'; for (let x = 60; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, COUNTER_Y + 14); ctx.lineTo(x, 520); ctx.stroke(); }
  // Belt legs, then the belt.
  ctx.fillStyle = '#7a808c'; for (const x of [WIN_L - 4, WIN_R + 4]) { ctx.fillRect(x - 5, BELT_Y + 30, 10, COUNTER_Y - BELT_Y - 30); ctx.fillStyle = '#9aa0ac'; ctx.fillRect(x - 9, COUNTER_Y - 4, 18, 5); ctx.fillStyle = '#7a808c'; }
  ctx.fillStyle = 'rgba(60,60,70,.2)'; ctx.fillRect(0, BELT_Y + 30, W, 5);
  ctx.fillStyle = lin(0, BELT_Y + 10, 0, BELT_Y + 30, [[0, '#c3c8d2'], [1, '#8a8f9c']]); rrect(-10, BELT_Y + 9, W + 20, 21, 6); ctx.fill();
  for (let x = 14; x < W; x += 34) { ell(x, BELT_Y + 20, 6.5, 6.5, '#e3e6ec'); ell(x, BELT_Y + 20, 4, 4, '#a3a8b4'); ctx.strokeStyle = '#6a6f7a'; ctx.lineWidth = 1.2; const a = beltX / 6.5; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 3.5, BELT_Y + 20 + Math.sin(a) * 3.5); ctx.lineTo(x - Math.cos(a) * 3.5, BELT_Y + 20 - Math.sin(a) * 3.5); ctx.stroke(); }
  ctx.fillStyle = lin(0, BELT_Y - 2, 0, BELT_Y + 10, [[0, '#5a606c'], [1, '#3a3e48']]); ctx.fillRect(-10, BELT_Y - 1, W + 20, 11);
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  for (let x = -20 + (beltX % 16); x < W + 16; x += 16) ctx.fillRect(x, BELT_Y, 3, 9);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-10, BELT_Y - 1, W + 20, 1.5);
}

function drawWindow() {
  // The scanner arch over the belt; a beam while the front cupcake is inside.
  const f = front(), inside = f && f.x > WIN_L && f.x < WIN_R && state === 'play';
  const fl = T - flash.t < .35, lamp = !fl ? (inside ? '#7fd6ff' : '#ffd166') : flash.ok ? '#5fc282' : '#ff5a5a';
  if (inside || fl) {
    const col = fl ? (flash.ok ? '95,194,130' : '255,90,90') : '127,214,255';
    ctx.fillStyle = lin(0, 300, 0, BELT_Y, [[0, `rgba(${col},.32)`], [1, `rgba(${col},.06)`]]);
    ctx.beginPath(); ctx.moveTo(WIN_L + 8, 300); ctx.lineTo(WIN_R - 8, 300); ctx.lineTo(WIN_R - 2, BELT_Y); ctx.lineTo(WIN_L + 2, BELT_Y); ctx.closePath(); ctx.fill();
    if (inside && !fl) { const sy = 302 + ((T * 70) % (BELT_Y - 304)); ctx.fillStyle = 'rgba(160,230,255,.8)'; ctx.fillRect(WIN_L + 6, sy, WIN_R - WIN_L - 12, 2); }
  }
}
function drawScannerFront() {
  const fl = T - flash.t < .35, f = front(), inside = f && f.x > WIN_L && f.x < WIN_R && state === 'play';
  const lamp = !fl ? (inside ? '#7fd6ff' : '#ffd166') : flash.ok ? '#5fc282' : '#ff5a5a';
  for (const x of [WIN_L - 4, WIN_R + 4]) {
    ctx.fillStyle = lin(x - 7, 0, x + 7, 0, [[0, '#9aa0ac'], [.5, '#e3e6ec'], [1, '#8a8f9c']]); rrect(x - 7, 296, 14, BELT_Y - 296 + 2, 4); ctx.fill();
    ell(x, 318, 2.5, 2.5, '#6a6f7a'); ell(x, BELT_Y - 14, 2.5, 2.5, '#6a6f7a');
  }
  ctx.fillStyle = 'rgba(60,60,70,.2)'; rrect(WIN_L - 14, 286, WIN_R - WIN_L + 28, 22, 9); ctx.fill();
  ctx.fillStyle = lin(0, 278, 0, 300, [[0, '#ffb3c7'], [1, '#f2849f']]); rrect(WIN_L - 14, 278, WIN_R - WIN_L + 28, 22, 9); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '900 11px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('C H E C K', 180, 293);
  ctx.fillStyle = '#6a6f7a'; rrect(168, 266, 24, 13, 5); ctx.fill();

function drawMachine() {

  ctx.fillStyle = lin(0, t0, 0, t0 + 104, [[0, '#a9e0d0'], [1, '#7cc8b2']]); rrect(-14, t0, 70, 104, 14); ctx.fill();
  ctx.fillStyle = '#5fae98'; rrect(-14, t0, 70, 16, 10); ctx.fill();
  ell(18, t0 + 44, 17, 17, '#4f8f7e'); ell(18, t0 + 44, 13, 13, lin(0, t0 + 31, 0, t0 + 57, [[0, '#ffe2a6'], [1, '#ffb45a']]));
  ell(13, t0 + 39, 4, 3, 'rgba(255,255,255,.6)');
  ctx.fillStyle = '#3a3e48'; rrect(30, t0 + 66, 26, 32, 4); ctx.fill();
  for (let k = 0; k < 3; k++) ell(-2 + k * 10, t0 + 8, 3, 3, ['#ff8fa8', '#ffd166', '#8fd3a8'][k]);
}

function drawBinAndBox() {
  // The bin (left) and the cake box (right), standing on the counter.
  const [bx] = BIN, top = COUNTER_Y - 52;
  ell(bx, COUNTER_Y + 1, 38, 6, 'rgba(60,40,30,.22)');
  ctx.fillStyle = lin(bx - 32, 0, bx + 32, 0, [[0, '#8a8f9c'], [.45, '#e3e6ec'], [1, '#7a808c']]);
  ctx.beginPath(); ctx.moveTo(bx - 32, top + 10); ctx.lineTo(bx + 32, top + 10); ctx.lineTo(bx + 27, COUNTER_Y); ctx.lineTo(bx - 27, COUNTER_Y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,75,85,.35)'; ctx.lineWidth = 2;
  for (const dx of [-14, 0, 14]) { ctx.beginPath(); ctx.moveTo(bx + dx, top + 18); ctx.lineTo(bx + dx * .85, COUNTER_Y - 8); ctx.stroke(); }
  ctx.fillStyle = '#5a606c'; rrect(bx - 36, top + 4, 72, 9, 4); ctx.fill();
  ctx.fillStyle = '#e0553f'; ctx.font = '900 10px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('TOSS', bx, COUNTER_Y - 18);
  // The cake box with its lid open and a ribbon.

  ctx.fillStyle = '#f5a3ba'; ctx.beginPath(); ctx.moveTo(cx - 40, ct); ctx.lineTo(cx - 34, ct - 26); ctx.lineTo(cx + 34, ct - 26); ctx.lineTo(cx + 40, ct); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd6e2'; ctx.beginPath(); ctx.moveTo(cx - 36, ct - 3); ctx.lineTo(cx - 31, ct - 22); ctx.lineTo(cx + 31, ct - 22); ctx.lineTo(cx + 36, ct - 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = lin(0, ct, 0, COUNTER_Y, [[0, '#ffd0dc'], [1, '#f08aa6']]); rrect(cx - 42, ct, 84, COUNTER_Y - ct, 6); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 4, ct, 8, COUNTER_Y - ct);
  ctx.fillStyle = 'rgba(255,255,255,.9)'; rrect(cx - 26, ct + 14, 52, 18, 9); ctx.fill();
  ctx.fillStyle = '#3f9e62'; ctx.font = '900 10px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText('BOX', cx, ct + 27);
  ell(cx - 9, ct - 2, 9, 5, '#ffffff', .4); ell(cx + 9, ct - 2, 9, 5, '#ffffff', -.4); ell(cx, ct - 1, 4, 4, '#ffe3ea');
}

function drawBelt() {
  for (const it of items) drawCupcake(it, it.x, BELT_Y, CAKE);
  const f = front();
  if (f && state === 'play') {
    // An arrow over the cupcake to check next.
    const bob = Math.sin(T * 6) * 2.5;
    ctx.fillStyle = '#ff8c2a'; ctx.beginPath(); ctx.moveTo(f.x - 7, BELT_Y - 112 + bob); ctx.lineTo(f.x + 7, BELT_Y - 112 + bob); ctx.lineTo(f.x, BELT_Y - 102 + bob); ctx.closePath(); ctx.fill();
  }
}
function drawFlying() {
  for (const fl of flying) {
    const u = fl.u, x = fl.from[0] + (fl.to[0] - fl.from[0]) * u, y = fl.from[1] + (fl.to[1] - fl.from[1]) * u - Math.sin(u * Math.PI) * 90;
    ctx.save(); ctx.translate(x, y); ctx.rotate((fl.to[0] < fl.from[0] ? -1 : 1) * u * 1.2); drawCupcake(fl.item, 0, 0, CAKE * (1 - u * .4)); ctx.restore();

}

function heart(x, y, r, full) {
  ctx.beginPath(); ctx.moveTo(x, y + r * .9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * .2, x - r * .7, y - r * 1.3, x, y - r * .45);
  ctx.bezierCurveTo(x + r * .7, y - r * 1.3, x + r * 1.6, y - r * .2, x, y + r * .9);
  ctx.fillStyle = full ? lin(x, y - r, x, y + r, [[0, '#ff8f98'], [1, '#f04a5a']]) : '#ecdcd0'; ctx.fill();
  if (full) ell(x - r * .45, y - r * .35, r * .28, r * .18, 'rgba(255,255,255,.7)', -.6);
}
function drawHud() {
  ctx.fillStyle = lin(0, 0, 0, 72, [[0, '#fffaf3'], [1, '#fff1e2']]); ctx.fillRect(0, 0, W, 72);
  ctx.fillStyle = 'rgba(160,100,60,.12)'; ctx.fillRect(0, 70, W, 2);
  ctx.fillStyle = '#e8584a'; ctx.font = '800 13px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('C U P C A K E   C H E C K', 180, 22);
  ctx.fillStyle = 'rgba(160,100,60,.14)'; rrect(132, 31, 96, 36, 18); ctx.fill();
  ctx.fillStyle = '#fffdf8'; rrect(132, 28, 96, 36, 18); ctx.fill(); ctx.strokeStyle = 'rgba(232,88,74,.4)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = '#b8462e'; ctx.font = '800 24px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText(String(score), 180, 54);
  for (let i = 0; i < LIVES; i++) heart(26 + i * 25, 46, 8.5, i < lives);
  if (state !== 'intro') { ctx.fillStyle = '#b08a6a'; ctx.font = '700 11px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.fillText(`${Math.min(spawned, PER_ORDER)} / ${PER_ORDER}`, 340, 50); }
}

function bigButton(r, label, face, edge, icon, down) {
  const [x, y, w, h] = r, dy = down ? 3 : 0;
  ctx.fillStyle = edge; rrect(x, y + 6, w, h, 24); ctx.fill();
  ctx.fillStyle = face; rrect(x, y + dy, w, h, 24); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; rrect(x + 5, y + 4 + dy, w - 10, h * .4, 18); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 21px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2 + (icon === 'bin' ? 12 : -12), y + h / 2 + dy + 1); ctx.textBaseline = 'alphabetic';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  if (icon === 'bin') { const cx = x + 30, cy = y + h / 2 + dy; ctx.beginPath(); ctx.moveTo(cx - 10, cy - 7); ctx.lineTo(cx + 10, cy - 7); ctx.moveTo(cx - 7, cy - 7); ctx.lineTo(cx - 5, cy + 10); ctx.lineTo(cx + 5, cy + 10); ctx.lineTo(cx + 7, cy - 7); ctx.moveTo(cx - 3, cy - 11); ctx.lineTo(cx + 3, cy - 11); ctx.stroke(); }
  else { const cx = x + w - 30, cy = y + h / 2 + dy; ctx.beginPath(); ctx.rect(cx - 10, cy - 6, 20, 16); ctx.moveTo(cx - 10, cy - 6); ctx.lineTo(cx - 13, cy - 11); ctx.moveTo(cx + 10, cy - 6); ctx.lineTo(cx + 13, cy - 11); ctx.stroke(); }
  ctx.lineCap = 'butt';
}
const BTN_TOSS = [18, 530, 156, 66], BTN_BOX = [186, 530, 156, 66];
function drawPanel() {
  ctx.fillStyle = lin(0, 518, 0, H, [[0, '#fff1e2'], [1, '#fffaf3']]); ctx.fillRect(0, 518, W, H - 518);
  ctx.fillStyle = 'rgba(160,100,60,.12)'; ctx.fillRect(0, 518, W, 2);
  const down = T - flash.t < .12;
  bigButton(BTN_TOSS, 'Toss', '#f27a63', '#c9503f', 'bin', down && flash.toss);
  bigButton(BTN_BOX, 'Box', '#5fc282', '#3f9e62', 'box', down && !flash.toss);
  ctx.textAlign = 'center';
  if (state === 'play' && T - whyAt < 2 && why) {
    ctx.fillStyle = 'rgba(240,90,70,.12)'; rrect(16, 604, 328, 26, 13); ctx.fill();
    ctx.fillStyle = '#d9483a'; ctx.font = '700 12.5px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText(why, 180, 622);
  } else if (state === 'play') {
    ctx.fillStyle = '#b08a6a'; ctx.font = '600 11.5px system-ui, sans-serif'; ctx.fillText('Check the cupcake under the arrow: Toss or Box it.', 180, 621);
  }
}

function drawBanner() {
  const s = el - orderAt;
  if (state !== 'play' || s > ORDER_PAUSE) return;
  const a = Math.min(1, s * 6, (ORDER_PAUSE - s) * 4);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,253,246,.96)'; rrect(70, 218, 220, 70, 20); ctx.fill();
  ctx.strokeStyle = '#ff9a2a'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#e8584a'; ctx.font = '900 22px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(orderNo === 1 ? 'First order!' : 'New order!', 180, 250);
  ctx.fillStyle = '#7a5a40'; ctx.font = '600 12px system-ui, sans-serif'; ctx.fillText('Read the ticket above.', 180, 272);
  ctx.globalAlpha = 1;
}

let btnY = 0;

  ctx.fillStyle = '#3f9e62'; rrect(x, y + 5, w, h, 26); ctx.fill();
  ctx.fillStyle = lin(0, y, 0, y + h, [[0, '#74d394'], [1, '#4fb874']]); rrect(x, y, w, h, 26); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; rrect(x + 5, y + 4, w - 10, h * .4, 20); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 20px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1); ctx.textBaseline = 'alphabetic';
}
function card(title, lines, btn, note, y0) {
  const h = 76 + lines.length * 22 + 74 + (note ? 18 : 0);
  ctx.fillStyle = 'rgba(255,246,236,.75)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(120,70,40,.18)'; rrect(26, y0 + 8, 308, h, 26); ctx.fill();
  ctx.fillStyle = lin(0, y0, 0, y0 + h, [[0, '#fffdf8'], [1, '#fff3e6']]); rrect(26, y0, 308, h, 26); ctx.fill();
  ctx.strokeStyle = 'rgba(232,88,74,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  drawCupcake({ frost: 'pink', top: 'cherry', spr: 'yes', seed: 5 }, 300, y0 + 24, .55);
  ctx.textAlign = 'center'; ctx.fillStyle = '#e8584a'; ctx.font = '800 28px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText(title, 180, y0 + 44);
  ctx.fillStyle = '#5a4a40'; ctx.font = '14px system-ui, sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, 180, y0 + 76 + i * 22));
  btnY = y0 + 76 + lines.length * 22;
  button(80, btnY, 200, 56, btn);
  if (note) { ctx.fillStyle = '#b8a090'; ctx.font = '11px system-ui, sans-serif'; ctx.fillText(note, 180, btnY + 82); }
}

// ---------- sound
let AC = null, master = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination);
}
function tone(f, when, dur, vol, type = 'sine', to = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, when);
  if (to) o.frequency.exponentialRampToValueAtTime(to, when + dur);
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + .012); g.gain.exponentialRampToValueAtTime(.0005, when + dur);
  o.connect(g); g.connect(master); o.start(when); o.stop(when + dur + .05);
}
function sGood(toss) { if (!AC) return; const t = AC.currentTime; if (toss) tone(500, t, .14, .08, 'triangle', 300); else { tone(784, t, .12, .07, 'triangle'); tone(1047, t + .08, .18, .06, 'triangle'); } }
function sBad() { if (AC) tone(240, AC.currentTime, .3, .12, 'triangle', 140); }
function sOrder() { if (!AC) return; const t = AC.currentTime; [523, 659, 784].forEach((f, i) => tone(f, t + i * .1, .3, .06, 'triangle')); }
function sEnd() { if (AC) { const t = AC.currentTime; [784, 659, 523].forEach((f, i) => tone(f, t + i * .14, .4, .08, 'triangle')); } }
function sClick() { if (AC) tone(880, AC.currentTime, .04, .05, 'triangle'); }

// ---------- input
function hit(x, y, r) { return x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]; }
function pagePos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = pagePos(e);
  audio();
  if (state === 'intro' || state === 'over') { if (x >= 80 && x <= 280 && y >= btnY && y <= btnY + 56) { sClick(); startRun(); } return; }
  if (hit(x, y, BTN_TOSS)) sort(true); else if (hit(x, y, BTN_BOX)) sort(false);
});
addEventListener('keydown', e => {
  if ((state === 'intro' || state === 'over') && (e.key === 'Enter' || e.key === ' ')) { audio(); startRun(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') sort(true);
  if (e.key === 'ArrowRight' || e.key === 'd') sort(false);
});

// ---------- frame
let last = performance.now(), lastOrder = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  update(dt);
  if (orderNo !== lastOrder) { lastOrder = orderNo; if (state === 'play') sOrder(); }
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  drawFactory(); drawWindow(); drawBelt(); drawScannerFront(); drawMachine(); drawBinAndBox(); drawFlying(); if (order) drawCard(); drawBanner(); drawHud(); drawPanel();
  if (state === 'intro') card('Cupcake Check', ['Cupcakes roll through the check window.', 'The order card says which ones to TOSS.', 'Box all the others!', 'Toss = left button, Box = right button.', 'A new order every 10 cupcakes. Three hearts.'], "Let's go", 'draft 2  ·  sound on', 150);
  if (state === 'over') card('No hearts left!', [why, `Cupcakes sorted right: ${score}`, score >= best && score > 0 ? 'A new best!' : `Best: ${best}`], 'Play again', '', 170);
  requestAnimationFrame(frame);
}

// ---------- tests and screenshots
function autoPlay() { const f = front(); if (f && f.x > WIN_L - 10 && !paused()) sort(shouldToss(order, f)); }
if (!order) { order = makeOrder(1); orderNo = 1; }
if (Q.get('t')) { startRun(); const until = Number(Q.get('t')); lives = 99; while (el < until) { autoPlay(); update(1 / 60); T += 1 / 60; } lives = Math.min(lives, LIVES); }
if (Q.has('over')) { state = 'over'; score = 31; best = 40; why = 'Toss it: it has pink frosting and no topping.'; }
window.__cc = { startRun, update, sort, front, autoPlay, makeOrder, makeItem, shouldToss, reason, orderText, condHolds, speed, FEATURES,
  get state() { return state; }, get lives() { return lives; }, set lives(v) { lives = v; }, get score() { return score; }, get order() { return order; },
  get orderNo() { return orderNo; }, get items() { return items; }, get el() { return el; }, get why() { return why; }, paused, setRnd: f => rnd = f };
requestAnimationFrame(frame);
</script>
