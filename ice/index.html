<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ice Glide</title>
<style>
html,body{margin:0;height:100%;background:#d6eeff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;margin:0 auto}
</style>

<body>
<canvas id="c"></canvas>
<script>
// Ice Glide, draft 2: Pip the penguin slides on the ice until a rock, the
// snow bank, or a snow patch stops it. Stop on the fish to eat it.
// Thirty lakes on a level map, harder lakes, and an ending.
const W = 360, H = 640;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const DIR_KEYS = ['up', 'right', 'down', 'left'];

// ---------- levels
const ICE = 0, ROCK = 1, SNOW = 2, LEVELS = 30;
function levelSpec(n) {
  if (n <= 2) return { cols: 5, rows: 6, rocks: [4, 6], snow: 0, fish: 1, par: n === 1 ? [2, 2] : [3, 3] };
  if (n <= 5) return { cols: 6, rows: 7, rocks: [6, 8], snow: 0, fish: 1, par: [4, 5] };
  if (n <= 10) return { cols: 6, rows: 8, rocks: [7, 10], snow: n <= 7 ? 1 : 2, fish: 1, par: n <= 7 ? [5, 6] : [6, 7] };
  if (n <= 15) return { cols: 7, rows: 9, rocks: [9, 13], snow: 2, fish: 1, par: [7, 9] };
  if (n <= 22) return { cols: 7, rows: 9, rocks: [9, 13], snow: 2, fish: 2, par: [7, 9] };
  if (n <= LEVELS) return { cols: 7, rows: 9, rocks: [10, 14], snow: 3, fish: 2, par: [9, 11] };
  // Endless lakes after the campaign: always hard, but varied.
  const r = mulberry(n * 104729 + 3), two = r() < .6, big = r() < .7;
  return { cols: big ? 7 : 6, rows: big ? 9 : 8, rocks: big ? [9, 14] : [7, 11], snow: 1 + Math.floor(r() * 3), fish: two ? 2 : 1, par: two ? [8, 11] : [7, 9] };
}

// Where Pip stops when sliding from cell (x, y) in direction d.
function slide(lv, x, y, d) {
  const [dx, dy] = DIRS[d];
  let cx = x, cy = y;
  for (;;) {
    const nx = cx + dx, ny = cy + dy;
    if (nx < 0 || ny < 0 || nx >= lv.cols || ny >= lv.rows || lv.grid[ny][nx] === ROCK) break;
    cx = nx; cy = ny;
    if (lv.grid[cy][cx] === SNOW) break;
  }
  return [cx, cy];
}
const key = (x, y) => y * 100 + x;
// Fewest slides from a cell to every cell Pip can stop on.
function distances(lv, x0, y0) {
  const dist = new Map([[key(x0, y0), 0]]), q = [[x0, y0]];
  while (q.length) {
    const [x, y] = q.shift(), d0 = dist.get(key(x, y));
    for (const d of DIR_KEYS) {
      const [nx, ny] = slide(lv, x, y, d);
      if (!dist.has(key(nx, ny))) { dist.set(key(nx, ny), d0 + 1); q.push([nx, ny]); }
    }
  }
  return dist;
}
// Best paths over (cell, fish eaten) from a state; returns {moves, firstDirs, paths}.
function solve(lv, x0, y0, eaten0) {
  const all = (1 << lv.fish.length) - 1;
  const eat = (x, y, m) => { lv.fish.forEach((f, i) => { if (f[0] === x && f[1] === y) m |= 1 << i; }); return m; };
  const sk = (x, y, m) => key(x, y) * 8 + m;
  const start = eat(x0, y0, eaten0);
  if (start === all) return { moves: 0, firstDirs: [], paths: 1 };
  const dist = new Map([[sk(x0, y0, start), 0]]), ways = new Map([[sk(x0, y0, start), 1]]), first = new Map([[sk(x0, y0, start), new Set()]]);
  let q = [[x0, y0, start]], depth = 0;
  while (q.length) {
    const next = [];
    let done = false;
    for (const [x, y, m] of q) {
      const s = sk(x, y, m);
      for (const d of DIR_KEYS) {
        const [nx, ny] = slide(lv, x, y, d);
        if (nx === x && ny === y) continue;
        const nm = eat(nx, ny, m), ns = sk(nx, ny, nm);
        const f = depth === 0 ? new Set([d]) : first.get(s);
        if (!dist.has(ns)) { dist.set(ns, depth + 1); ways.set(ns, ways.get(s)); first.set(ns, new Set(f)); next.push([nx, ny, nm]); }
        else if (dist.get(ns) === depth + 1) { ways.set(ns, ways.get(ns) + ways.get(s)); for (const v of f) first.get(ns).add(v); }
        if (nm === all) done = true;
      }
    }
    depth++;
    if (done) {
      let paths = 0; const dirs = new Set();
      for (const [x, y, m] of next) if (m === all) { const s = sk(x, y, m); paths += ways.get(s); for (const v of first.get(s)) dirs.add(v); }
      return { moves: depth, firstDirs: [...dirs], paths };
    }
    q = next;
  }
  return { moves: -1, firstDirs: [], paths: 0 };
}

// A lake from its number: random rocks and snow, then fish placed on cells
// that are far (in slides) from Pip, checked by a full search.
function makeLevel(n) {
  const spec = levelSpec(n), rnd = mulberry(n * 7919 + 17);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  let best = null;
  for (let tries = 0; tries < 800; tries++) {
    const lv = { n, cols: spec.cols, rows: spec.rows, grid: [], fish: [] };
    for (let y = 0; y < spec.rows; y++) lv.grid.push(new Array(spec.cols).fill(ICE));
    const free = () => { for (let k = 0; k < 200; k++) { const x = ri(0, spec.cols - 1), y = ri(0, spec.rows - 1); if (lv.grid[y][x] === ICE) return [x, y]; } return null; };
    for (let k = ri(spec.rocks[0], spec.rocks[1]); k > 0; k--) { const c = free(); if (c) lv.grid[c[1]][c[0]] = ROCK; }
    for (let k = spec.snow; k > 0; k--) { const c = free(); if (c) lv.grid[c[1]][c[0]] = SNOW; }
    const s = free(); if (!s) continue;
    lv.start = s;
    const dist = distances(lv, s[0], s[1]);
    // Pip must be able to reach a good share of the lake, so there are real choices.
    if (dist.size < spec.cols * spec.rows * .3) continue;
    const stops = [...dist.entries()].filter(([k]) => k !== key(s[0], s[1])).map(([k, d]) => [k % 100, Math.floor(k / 100), d]);
    const cands = [];
    if (spec.fish === 1) {
      for (const c of stops) if (c[2] >= spec.par[0] && c[2] <= spec.par[1]) cands.push([[c[0], c[1]]]);
    } else {
      const far = stops.filter(c => c[2] >= 2);
      for (let k = 0; k < 12 && far.length > 1; k++) {
        const a = far[ri(0, far.length - 1)], b = far[ri(0, far.length - 1)];
        if (a !== b) cands.push([[a[0], a[1]], [b[0], b[1]]]);
      }
    }
    if (!cands.length) continue;
    for (let k = 0; k < 4; k++) {
      lv.fish = cands[ri(0, cands.length - 1)];
      const sol = solve(lv, s[0], s[1], 0);
      if (sol.moves < 0) continue;
      const inRange = sol.moves >= spec.par[0] && sol.moves <= spec.par[1];
      const gap = sol.moves < spec.par[0] ? spec.par[0] - sol.moves : sol.moves - spec.par[1];
      // Few best paths and one right first slide make the puzzle need thought.
      const score = inRange ? sol.paths + (sol.firstDirs.length - 1) * 2 : 1000 + gap;
      if (!best || score < best.score) best = { lv: { ...lv, fish: lv.fish.map(f => [...f]) }, score, sol };
    }
    if (best && best.score <= 2) break;
  }
  best.lv.par = best.sol.moves;
  return best.lv;
}

// ---------- state
let state = 'intro', T = 0, levelNo = 1, lv = null, pip = null, moves = 0, eaten = 0, history = [], hintUsed = false, hint = null;
let anim = null, bump = null, winAt = -1, stars = 0, swipe = null, sparkles = [], hearts = [], flips = [], trails = [], newBest = false;
let progress = {};
try { progress = JSON.parse(localStorage.getItem('iceglide2') || '{}'); } catch (e) { /* storage off */ }
if (Q.has('all')) for (let n = 1; n <= LEVELS; n++) progress[n] = progress[n] || 1;
const totalStars = () => { let t = 0; for (let n = 1; n <= LEVELS; n++) t += progress[n] || 0; return t; };
const unlocked = n => n === 1 || (progress[n - 1] || 0) > 0;
const firstOpen = () => { for (let n = 1; n <= LEVELS; n++) if (!progress[n]) return n; return LEVELS; };
const endlessOpen = () => (progress[LEVELS] || 0) > 0;
// The next endless lake: one past the furthest endless lake solved.
const endlessNext = () => Math.max(LEVELS + 1, (progress.endless || LEVELS) + 1);

function startLevel(n) {
  levelNo = Math.max(1, n); lv = makeLevel(levelNo);
  pip = { x: lv.start[0], y: lv.start[1], face: 'down' };
  moves = 0; eaten = 0; history = []; hintUsed = false; hint = null; anim = null; bump = null; winAt = -1;
  sparkles = []; hearts = []; flips = []; trails = []; newBest = false;
  state = 'play';
}
function allEaten() { return eaten === (1 << lv.fish.length) - 1; }
function busy() { return anim || winAt >= 0; }

function move(d) {
  if (state !== 'play' || busy()) return;
  audio();
  const [nx, ny] = slide(lv, pip.x, pip.y, d);
  pip.face = d;
  if (nx === pip.x && ny === pip.y) { bump = { d, t: T }; sBump(); return; }
  history.push({ x: pip.x, y: pip.y, eaten, moves });
  const cells = Math.abs(nx - pip.x) + Math.abs(ny - pip.y);
  anim = { from: [pip.x, pip.y], to: [nx, ny], d, t: T, dur: Math.max(.2, cells * .075), passed: [] };
  trails.push({ from: [pip.x, pip.y], to: [nx, ny], t: T }); if (trails.length > 3) trails.shift();
  hint = null; moves++; sSlide(cells);
}
function finishSlide() {
  const a = anim; anim = null;
  pip.x = a.to[0]; pip.y = a.to[1];
  bump = { d: a.d, t: T, land: true };
  let ate = false;
  lv.fish.forEach((f, i) => { if (f[0] === pip.x && f[1] === pip.y && !(eaten & 1 << i)) { eaten |= 1 << i; ate = true; for (let k = 0; k < 6; k++) hearts.push({ x: f[0], y: f[1], a: k / 6 * TAU, t: T }); } });
  if (ate) sEat(); else if (lv.grid[pip.y][pip.x] === SNOW) sSnow(); else sStop();
  if (allEaten()) {
    winAt = T;
    stars = moves <= lv.par ? 3 : moves <= lv.par + 2 ? 2 : 1;
    if (hintUsed) stars = Math.min(stars, 2);
    const p = progress[levelNo] || 0;
    newBest = stars > p;
    if (levelNo > LEVELS) progress.endless = Math.max(progress.endless || LEVELS, levelNo);
    else if (newBest) progress[levelNo] = stars;
    try { localStorage.setItem('iceglide2', JSON.stringify(progress)); } catch (e) { /* storage off */ }
  }
}
function undo() {
  if (state !== 'play' || busy() || !history.length) return;
  audio(); sClick();
  const h = history.pop(); pip.x = h.x; pip.y = h.y; eaten = h.eaten; moves = h.moves; hint = null; trails.pop();
}
function restart() { if (state !== 'play' || anim) return; audio(); sClick(); startLevel(levelNo); }
function showHint() {
  if (state !== 'play' || busy()) return;
  audio(); sClick();
  const sol = solve(lv, pip.x, pip.y, eaten);
  hintUsed = true;
  hint = sol.moves < 0 ? { stuck: true, t: T } : { d: sol.firstDirs[0], t: T, left: sol.moves };
}
function nextFromWin() { if (levelNo === LEVELS) state = 'done'; else startLevel(levelNo + 1); }
function update(dt) {
  if (anim) {
    const u = (T - anim.t) / anim.dur;
    // Fish passed over flip: "almost!"
    const [fx, fy] = anim.from, [tx, ty] = anim.to, e = ease(Math.min(1, u));
    const cx = fx + (tx - fx) * e, cy = fy + (ty - fy) * e;
    lv.fish.forEach((f, i) => { if (!(eaten & 1 << i) && !anim.passed.includes(i) && Math.abs(f[0] - cx) < .3 && Math.abs(f[1] - cy) < .3 && !(f[0] === tx && f[1] === ty)) { anim.passed.push(i); flips.push({ i, t: T }); } });
    if (u >= 1) finishSlide();
  }
  if (winAt >= 0 && T - winAt > .9 && state === 'play') { state = 'won'; sWin(); }
}
const ease = u => 1 - Math.pow(1 - u, 2.2);

// ---------- layout
const BOARD = { top: 106, w: 314, h: 428 };
function boardRect() {
  const cs = Math.min(BOARD.w / lv.cols, BOARD.h / lv.rows), w = cs * lv.cols, h = cs * lv.rows;
  return { x: (W - w) / 2, y: BOARD.top + (BOARD.h - h) / 2, cs, w, h };
}
function cellCenter(x, y) { const b = boardRect(); return [b.x + (x + .5) * b.cs, b.y + (y + .5) * b.cs]; }
function pipPos() {
  if (!anim) return [pip.x, pip.y];
  const u = ease(Math.min(1, (T - anim.t) / anim.dur));
  return [anim.from[0] + (anim.to[0] - anim.from[0]) * u, anim.from[1] + (anim.to[1] - anim.from[1]) * u];
}

// ---------- drawing helpers
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ell(x, y, rx, ry, col, rot = 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); ctx.fill(); }
function lin(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rad(x, y, r, stops) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function hash(n) { const x = Math.sin(n * 127.1 + 31.7) * 43758.5453; return x - Math.floor(x); }
function text(s, x, y, size, col, weight = 800, align = 'center') { ctx.fillStyle = col; ctx.font = `${weight} ${size}px "Trebuchet MS", system-ui, sans-serif`; ctx.textAlign = align; ctx.fillText(s, x, y); }
function pill(x, y, w, h) {
  ctx.fillStyle = 'rgba(60,120,180,.16)'; rrect(x, y + 3, w, h, h / 2); ctx.fill();
  ctx.fillStyle = lin(0, y, 0, y + h, [[0, '#ffffff'], [1, '#eef7ff']]); rrect(x, y, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(90,150,210,.28)'; ctx.lineWidth = 1; ctx.stroke();
}

// ---------- scene
function drawBackdrop() {
  ctx.fillStyle = lin(0, 0, 0, H, [[0, '#a9dcff'], [.18, '#d2edff'], [.5, '#eaf6ff'], [1, '#f6fbff']]); ctx.fillRect(0, 0, W, H);
  // A soft winter sun.
  ctx.fillStyle = rad(300, 26, 60, [[0, 'rgba(255,255,240,.9)'], [.25, 'rgba(255,250,225,.55)'], [1, 'rgba(255,250,225,0)']]); ctx.fillRect(220, 0, 140, 100);
  // Far blue mountains with snowy tops.
  for (const [mx, mh, mw, col] of [[40, 52, 70, '#b5d6f0'], [120, 64, 80, '#a9cfee'], [215, 48, 70, '#b5d6f0'], [300, 60, 80, '#a9cfee']]) {
    const base = 104;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(mx - mw, base); ctx.lineTo(mx, base - mh); ctx.lineTo(mx + mw, base); ctx.fill();
    ctx.fillStyle = '#f4faff'; ctx.beginPath(); ctx.moveTo(mx - mw * .3, base - mh * .7); ctx.lineTo(mx, base - mh); ctx.lineTo(mx + mw * .3, base - mh * .7);
    ctx.lineTo(mx + mw * .15, base - mh * .62); ctx.lineTo(mx, base - mh * .72); ctx.lineTo(mx - mw * .14, base - mh * .6); ctx.fill();
  }
  // Snowy ground with a few pines at the sides.
  ctx.fillStyle = lin(0, 90, 0, H, [[0, '#f7fbff'], [.12, '#e2eef9'], [1, '#d9e9f6']]); ctx.beginPath(); ctx.moveTo(0, 100); ctx.quadraticCurveTo(100, 86, 180, 98); ctx.quadraticCurveTo(270, 108, 360, 94); ctx.lineTo(360, H); ctx.lineTo(0, H); ctx.fill();
  for (const [px, py, s] of [[10, 112, .9], [350, 110, .9]]) pine(px, py, s);
  // Gentle snow dunes under the lake.
  ctx.fillStyle = '#e6f2fc'; ctx.beginPath(); ctx.moveTo(0, 600); ctx.quadraticCurveTo(120, 580, 200, 598); ctx.quadraticCurveTo(290, 614, 360, 592); ctx.lineTo(360, H); ctx.lineTo(0, H); ctx.fill();
}
function pine(x, y, s) {
  ctx.fillStyle = '#7a5a3a'; ctx.fillRect(x - 2 * s, y - 4 * s, 4 * s, 8 * s);
  for (let k = 0; k < 3; k++) {
    const w = (16 - k * 4) * s, ty = y - 6 * s - k * 9 * s;
    ctx.fillStyle = k % 2 ? '#3f9a6a' : '#4cae78';
    ctx.beginPath(); ctx.moveTo(x - w, ty + 4 * s); ctx.lineTo(x, ty - 12 * s); ctx.lineTo(x + w, ty + 4 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.moveTo(x - w * .45, ty - 3 * s); ctx.lineTo(x, ty - 12 * s); ctx.lineTo(x + w * .45, ty - 3 * s); ctx.quadraticCurveTo(x, ty - 6 * s, x - w * .45, ty - 3 * s); ctx.fill();
  }
}

function drawLake() {
  const b = boardRect(), m = 13;
  // The snow bank: a soft shadow, then a lumpy white rim.
  ctx.fillStyle = 'rgba(70,120,170,.2)'; rrect(b.x - m, b.y - m + 8, b.w + m * 2, b.h + m * 2, 24); ctx.fill();
  ctx.fillStyle = '#ffffff'; rrect(b.x - m, b.y - m, b.w + m * 2, b.h + m * 2, 24); ctx.fill();
  const bumps = (x0, y0, x1, y1, r) => {
    const len = Math.hypot(x1 - x0, y1 - y0), k = Math.max(2, Math.round(len / 22));
    for (let i = 0; i <= k; i++) { const u = i / k; ell(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u, r * (.85 + hash(i * 3 + x0) * .3), r * .8, '#ffffff'); }
  };
  bumps(b.x, b.y - m + 1, b.x + b.w, b.y - m + 1, 9);
  bumps(b.x - m + 1, b.y + 10, b.x - m + 1, b.y + b.h - 10, 7);
  bumps(b.x + b.w + m - 1, b.y + 10, b.x + b.w + m - 1, b.y + b.h - 10, 7);
  ctx.fillStyle = lin(0, b.y + b.h, 0, b.y + b.h + m, [[0, '#ffffff'], [1, '#dcebf7']]); rrect(b.x - m, b.y + b.h - 4, b.w + m * 2, m + 4, 12); ctx.fill();
  // A blue rim of snow shade where the ice meets the bank.
  ctx.fillStyle = '#c4dcef'; rrect(b.x - 3, b.y - 3, b.w + 6, b.h + 6, 15); ctx.fill();
  // The ice.
  ctx.save(); rrect(b.x, b.y, b.w, b.h, 13); ctx.clip();
  ctx.fillStyle = lin(b.x, b.y, b.x + b.w * .4, b.y + b.h, [[0, '#d6f2ff'], [.5, '#b4e1fb'], [1, '#8fcbf0']]); ctx.fillRect(b.x, b.y, b.w, b.h);
  // Light spots in the ice.
  for (let k = 0; k < 5; k++) {
    const sx = b.x + hash(lv.n * 5 + k) * b.w, sy = b.y + hash(lv.n * 9 + k * 3) * b.h, r = 50 + hash(k * 11) * 60;
    ctx.fillStyle = rad(sx, sy, r, [[0, 'rgba(255,255,255,.22)'], [1, 'rgba(255,255,255,0)']]); ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
  }
  // Two broad sheen bands across the lake.
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  for (const off of [.18, .58]) { const x0 = b.x + b.w * off; ctx.beginPath(); ctx.moveTo(x0, b.y); ctx.lineTo(x0 + 46, b.y); ctx.lineTo(x0 - b.h * .35 + 46, b.y + b.h); ctx.lineTo(x0 - b.h * .35, b.y + b.h); ctx.fill(); }
  // Faint tile seams.
  ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = 1;
  for (let x = 1; x < lv.cols; x++) { ctx.beginPath(); ctx.moveTo(b.x + x * b.cs, b.y); ctx.lineTo(b.x + x * b.cs, b.y + b.h); ctx.stroke(); }
  for (let y = 1; y < lv.rows; y++) { ctx.beginPath(); ctx.moveTo(b.x, b.y + y * b.cs); ctx.lineTo(b.x + b.w, b.y + y * b.cs); ctx.stroke(); }
  // A few thin cracks.
  ctx.lineCap = 'round';
  for (let y = 0; y < lv.rows; y++) for (let x = 0; x < lv.cols; x++) {
    if (hash(lv.n * 31 + x * 7 + y * 13) > .14 || lv.grid[y][x] !== ICE) continue;
    const [cx, cy] = cellCenter(x, y), r = b.cs * .32, a = hash(x * 5 + y * 3) * TAU;
    const pts = [[cx - Math.cos(a) * r, cy - Math.sin(a) * r], [cx + (hash(x + y * 9) - .5) * r * .5, cy + (hash(x * 9 + y) - .5) * r * .5], [cx + Math.cos(a) * r, cy + Math.sin(a) * r]];
    for (const [col, off] of [['rgba(70,140,200,.25)', 1], ['rgba(255,255,255,.75)', 0]]) {

    if (open) { ell(cx - 8, cy - 9, 8, 3, 'rgba(255,255,255,.6)', -.4); text(`${n}`, cx, cy + 7, 18, '#1f4a7a', 900); }
    else { ctx.fillStyle = '#9fb3c8'; rrect(cx - 7, cy - 3, 14, 11, 3); ctx.fill(); ctx.strokeStyle = '#9fb3c8'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy - 3, 4.5, Math.PI, 0); ctx.stroke(); }
    for (let k = 0; k < 3; k++) star(cx - 13 + k * 13, cy + 31, 5.5, k < got, open ? 'rgba(120,160,200,.35)' : 'rgba(120,160,200,.15)');
    if (open) hits.push({ x: cx - 28, y: cy - 28, w: 56, h: 66, id: 'lake' + n });
  }
  // Endless lakes open after lake 30.
  const ey = 552, eo = endlessOpen();
  ctx.globalAlpha = eo ? 1 : .5;
  pill(40, ey - 8, 280, 44);
  text(eo ? `Endless lakes  ·  next ${endlessNext()}` : 'Endless lakes  ·  after lake 30', 180, ey + 19, 14, '#2a5a8a', 800);
  ctx.globalAlpha = 1;
  if (eo) hits.push({ x: 40, y: ey - 8, w: 280, h: 44, id: 'endless' });
  button(120, 600, 120, 34, 'Back', false, 'back');
}

// ---------- sound
let AC = null, master = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination);
}
function tone(f, when, dur, vol, type = 'sine', to = 0) {

  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, when);
  if (to) o.frequency.exponentialRampToValueAtTime(to, when + dur);
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + .012); g.gain.exponentialRampToValueAtTime(.0005, when + dur);

}
function sSlide(cells) { if (AC) tone(900, AC.currentTime, .1 + cells * .06, .03, 'sine', 500); }
function sStop() { if (AC) tone(320, AC.currentTime, .08, .06, 'triangle'); }
function sSnow() { if (AC) tone(200, AC.currentTime, .12, .06, 'sine', 120); }
function sBump() { if (AC) tone(160, AC.currentTime, .1, .07, 'triangle'); }
function sEat() { if (!AC) return; const t = AC.currentTime; tone(660, t, .12, .07, 'triangle'); tone(990, t + .08, .16, .07, 'triangle'); }
function sWin() { if (!AC) return; const t = AC.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .1, .45, .07, 'triangle')); }
function sClick() { if (AC) tone(880, AC.currentTime, .04, .05, 'triangle'); }

// ---------- input
function pagePos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; }
let mapFrom = 'play';
function press(id) {
  sClick();
  if (id === 'go') startLevel(firstOpen());
  else if (id === 'next') nextFromWin();
  else if (id === 'again') startLevel(levelNo);
  else if (id === 'map') { mapFrom = state === 'play' ? 'play' : 'none'; state = 'map'; }
  else if (id === 'back') { if (mapFrom === 'play') state = 'play'; else startLevel(firstOpen()); }
  else if (id === 'endless') startLevel(endlessNext());
  else if (id.startsWith('lake')) startLevel(Number(id.slice(4)));
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = pagePos(e);
  audio();
  if (state !== 'play') { for (const h of hits) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { press(h.id); return; } return; }
  if (y >= 28 && y <= 74 && x < 122) { press('map'); return; }
  if (y >= BTN_Y && y <= BTN_Y + BTN_H + 6) { for (const bt of BTNS) if (x >= bt.x && x <= bt.x + BTN_W) ({ undo, hint: showHint, restart })[bt.id](); return; }
  swipe = { x, y, t: T };
});
cv.addEventListener('pointerup', e => {
  if (!swipe || state !== 'play') { swipe = null; return; }
  const [x, y] = pagePos(e), dx = x - swipe.x, dy = y - swipe.y; swipe = null;
  if (Math.hypot(dx, dy) > 18) { move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); return; }
  // A tap: a square in Pip's row or column sends Pip that way.
  const b = boardRect(), gx = Math.floor((x - b.x) / b.cs), gy = Math.floor((y - b.y) / b.cs);
  if (gx < 0 || gy < 0 || gx >= lv.cols || gy >= lv.rows) return;
  if (gy === pip.y && gx !== pip.x) move(gx > pip.x ? 'right' : 'left');
  else if (gx === pip.x && gy !== pip.y) move(gy > pip.y ? 'down' : 'up');
});
addEventListener('keydown', e => {
  const k = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  if (state === 'intro' && (e.key === 'Enter' || e.key === ' ')) { audio(); press('go'); return; }
  if (state === 'won' && (e.key === 'Enter' || e.key === ' ')) { audio(); press('next'); return; }
  if (k) { e.preventDefault(); move(k); }
  if (e.key === 'z' || e.key === 'Backspace') undo();
  if (e.key === 'h') showHint();
  if (e.key === 'r') restart();
});

// ---------- frame
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  update(dt);
  hits = [];
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  drawBackdrop();
  if (lv && state !== 'map') {
    drawLake();
    for (let y = 0; y < lv.rows; y++) for (let x = 0; x < lv.cols; x++) { if (lv.grid[y][x] === SNOW) drawSnow(x, y); }
    lv.fish.forEach((f, i) => drawFish(i, f));
    // Rocks below Pip's row draw over Pip, so Pip stands behind them.
    for (let y = 0; y < lv.rows; y++) for (let x = 0; x < lv.cols; x++) if (lv.grid[y][x] === ROCK && y <= pipPos()[1]) drawRock(x, y);
    drawArrows(); drawPip();
    for (let y = 0; y < lv.rows; y++) for (let x = 0; x < lv.cols; x++) if (lv.grid[y][x] === ROCK && y > pipPos()[1]) drawRock(x, y);
    drawEffects();
    drawHud(); drawButtons();
  }
  drawCards();
  requestAnimationFrame(frame);
}

// ---------- tests and screenshots
levelNo = Number(Q.get('level') || 1);
startLevel(levelNo); state = 'intro';
if (Q.has('play')) state = 'play';
if (Q.has('hint')) { state = 'play'; showHint(); }
if (Q.has('won')) { state = 'won'; stars = 2; moves = lv.par + 1; }
if (Q.has('map')) { state = 'map'; mapFrom = 'none'; }
if (Q.has('done')) state = 'done';
window.__ig = { makeLevel, solve, slide, distances, levelSpec, startLevel, move, undo, restart, showHint, update, press, nextFromWin, ICE, ROCK, SNOW, LEVELS,
  get lv() { return lv; }, get pip() { return pip; }, get moves() { return moves; }, get eaten() { return eaten; }, get state() { return state; },
  get stars() { return stars; }, get hint() { return hint; }, get hintUsed() { return hintUsed; }, get progress() { return progress; }, unlocked, totalStars, endlessNext, endlessOpen,
  busy, tick: dt => { T += dt; update(dt); } };
requestAnimationFrame(frame);
