<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hop & Pop</title>
<style>
html,body{margin:0;height:100%;background:#eef8e8;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Hop & Pop, draft 3: two lanes at once. Left: hop the bunny over the logs.
// Right: pop the target fruit before it lands, and never tap a bee.
const W = 360, H = 640, LANE_TOP = 78, GROUND = 560, MID = 180, LIVES = 3;
const BUNNY_X = 90, BUNNY_Y = 540, HOP_TIME = .62, HOP_H = 56, FRUIT_TOP = 96, FRUIT_FLOOR = 586;
const GAP = .6;            // seconds kept between a hop moment and a target fruit's landing
const SWITCH_FROM = 30, SWITCH_EVERY = 20, GRACE = 1.2, SAFE = 1.0, SWITCH_PAUSE = 1.2, BANNER = 2.0;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const Q = new URLSearchParams(location.search);
let rnd = mulberry(Q.get('seed') ? Number(Q.get('seed')) : (Date.now() % 1e9) | 0);
const TAU = Math.PI * 2;

// ---------- difficulty by seconds played
function logSpeed(e) { return Math.min(300, 150 + 2.2 * e); }
function logGap(e) { return Math.max(1.0, 2.4 - e * .02) + rnd() * .8; }
function fruitSpeed(e) { return Math.min(140, 55 + 1.2 * e); }
function fruitGap(e) { return Math.max(.55, 1.5 - e * .012) + rnd() * .4; }
function targetAt(e) { return e < SWITCH_FROM ? 'apple' : (Math.floor((e - SWITCH_FROM) / SWITCH_EVERY) % 2 === 0 ? 'pear' : 'apple'); }

// ---------- state
let state = 'intro', T = 0, el = 0, lives = LIVES, score = 0, best = 0;
let hopT = -9, safeUntil = -9, logs = [], items = [], nextLog = 0, nextFruit = 0, lastTarget = 'apple', switchAt = -9;
let why = '', whyAt = -9, pops = [], bumps = [], puffs = [], sinceBee = 0, dist = 0, signFlash = -9;
try { best = Number(localStorage.getItem('hopandpop_best') || 0); } catch (e) { /* storage off */ }

function startRun() {
  state = 'play'; el = 0; lives = LIVES; score = 0; hopT = -9; safeUntil = -9;
  logs = []; items = []; pops = []; bumps = []; nextLog = 1.2; nextFruit = .6; lastTarget = 'apple'; switchAt = -9; why = ''; sinceBee = 0; dist = 0; puffs = []; signFlash = -9;
}

// When a log meets the bunny, and when a fruit lands, in run seconds.
function logArrival(l) { return l.t0 + (BUNNY_Y - LANE_TOP) / l.v; }
function fruitLanding(f) { return f.t0 + (FRUIT_FLOOR - FRUIT_TOP) / f.v; }
function clashes(t) { return logs.some(l => Math.abs(logArrival(l) - t) < GAP); }

function spawn() {
  while (el >= nextLog) {
    const l = { t0: nextLog, v: logSpeed(nextLog), hopped: false, hit: false };
    // A log must not meet the bunny near a target fruit's landing: wait a little.
    if (targetClash(logArrival(l))) { nextLog += .25; continue; }
    logs.push(l);
    nextLog += logGap(nextLog);
  }
  while (el >= nextFruit) {
    const t0 = nextFruit, v = fruitSpeed(t0), target = targetAt(t0 + (FRUIT_FLOOR - FRUIT_TOP) / v);
    let kind;
    const r = rnd();
    // A bee at least every sixth item, so the right lane always asks for care.
    if (r < (t0 < 15 ? .22 : .3) || sinceBee >= 5) kind = 'bee';
    else if (t0 >= 15 && r < .55) kind = target === 'apple' ? 'pear' : 'apple';
    else kind = target;
    const f = { t0, v, kind, x: MID + 28 + rnd() * (W - MID - 56), done: false, wob: rnd() * TAU };
    // A fruit to pop must not land near a hop moment; a later log is checked when it spawns.
    if (kind === target && clashes(fruitLanding(f))) { nextFruit += .25; continue; }
    items.push(f);
    sinceBee = kind === 'bee' ? 0 : sinceBee + 1;
    nextFruit += fruitGap(t0);
  }
}

function targetClash(t) { return items.some(f => f.kind === targetAt(fruitLanding(f)) && Math.abs(fruitLanding(f) - t) < GAP); }

function lose(reason) {
  lives--; why = reason; whyAt = T; sLose();
  if (lives <= 0) endRun();
}
function endRun() {
  state = 'over'; sEnd();
  if (score > best) { best = score; try { localStorage.setItem('hopandpop_best', String(best)); } catch (e) { /* storage off */ } }
}

function bunnyHeight() { const u = (el - hopT) / HOP_TIME; return u >= 0 && u <= 1 ? HOP_H * Math.sin(Math.PI * u) : 0; }
function hop() { if (state !== 'play') return; if (el - hopT >= HOP_TIME) { hopT = el; sHop(); } }
function tapRight(x, y) {
  if (state !== 'play') return;
  let bestF = null, bestD = 30;
  for (const f of items) {
    if (f.done) continue;
    const p = itemPos(f), d = Math.hypot(p[0] - x, p[1] - y);
    if (d < bestD) { bestD = d; bestF = f; }
  }
  if (!bestF) return;
  const p = itemPos(bestF);
  bestF.done = true;
  if (bestF.kind === 'bee') { bumps.push({ x: p[0], y: p[1], t: T }); lose('That was a bee!'); return; }
  const target = targetAt(el);
  if (bestF.kind === target) { score++; pops.push({ x: p[0], y: p[1], t: T, kind: bestF.kind }); sPop(); return; }
  // Just after a switch, the old target is forgiven (no point, no heart).
  if (el - switchAt < GRACE) { pops.push({ x: p[0], y: p[1], t: T, kind: bestF.kind }); return; }
  bumps.push({ x: p[0], y: p[1], t: T });
  signFlash = T;
  lose(`Leave the ${bestF.kind}s now: pop the ${target}s!`);
}
function itemPos(f) {
  const y = FRUIT_TOP + (el - f.t0) * f.v;
  const x = f.kind === 'bee' ? f.x + Math.sin(el * 5 + f.wob) * 12 : f.x;
  return [x, y];
}

function update(dt) {
  if (state !== 'play') return;
  el += dt;
  dist += logSpeed(el) * dt;
  spawn();
  const target = targetAt(el);
  if (target !== lastTarget) {
    lastTarget = target; switchAt = el; sSwitch();
    // Clear the air: every fruit still falling puffs away, so none is in doubt.
    for (const f of items) if (!f.done && f.kind !== 'bee') { const p = itemPos(f); f.done = true; f.puffed = true; puffs.push({ x: p[0], y: p[1], t: T }); }
    nextFruit = Math.max(nextFruit, el + SWITCH_PAUSE);
  }
  // Logs: a bump when one meets the bunny on the ground.
  for (const l of logs) {
    if (l.hit || l.hopped) continue;
    const y = LANE_TOP + (el - l.t0) * l.v;
    if (y >= BUNNY_Y - 14 && y <= BUNNY_Y + 10) {
      if (bunnyHeight() > 16) { l.hopped = true; score++; }
      else if (el >= safeUntil) { l.hit = true; safeUntil = el + SAFE; bumps.push({ x: BUNNY_X, y: BUNNY_Y - 6, t: T, log: true }); lose('The bunny bumped a log.'); if (state !== 'play') return; }
      else l.hopped = true;
    }
  }
  logs = logs.filter(l => LANE_TOP + (el - l.t0) * l.v < H + 40);
  // Fruit: a target that lands costs a heart.
  for (const f of items) {
    if (f.done) continue;
    if (itemPos(f)[1] >= FRUIT_FLOOR) {
      f.done = true;
      if (f.kind !== 'bee' && f.kind === targetAt(el) && el - switchAt >= GRACE) { signFlash = T; lose(`A${f.kind === 'apple' ? 'n apple' : ' pear'} fell: pop the ${f.kind}s!`); if (state !== 'play') return; }
    }
  }
  items = items.filter(f => !f.done || itemPos(f)[1] < FRUIT_FLOOR + 30);
}

// ---------- drawing
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ell(x, y, rx, ry, col, rot = 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); ctx.fill(); }
function lin(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rad(x, y, r0, x1, y1, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x1, y1, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function hash(n) { const x = Math.sin(n * 127.1 + 31.7) * 43758.5453; return x - Math.floor(x); }
const LANE_BOT = GROUND + 40;

// ----- left lane: a forest path
function drawTree(x, y, k) {
  ell(x + 6, y + 30 * k, 26 * k, 8 * k, 'rgba(40,80,30,.22)');
  ctx.fillStyle = '#8a5a34'; rrect(x - 4 * k, y + 4 * k, 8 * k, 26 * k, 3 * k); ctx.fill();
  const g = rad(x - 8 * k, y - 14 * k, 2, x, y - 4 * k, 30 * k, [[0, '#8fd86e'], [.6, '#5fb44c'], [1, '#3f8f3a']]);
  ctx.fillStyle = g;
  for (const [dx, dy, r] of [[-12, -2, 15], [12, -2, 15], [0, -14, 17], [0, 2, 16]]) { ctx.beginPath(); ctx.arc(x + dx * k, y + dy * k, r * k, 0, TAU); ctx.fill(); }
  ell(x - 7 * k, y - 18 * k, 5 * k, 3 * k, 'rgba(255,255,255,.25)', -.5);
}
function drawBush(x, y) {
  ctx.fillStyle = lin(0, y - 12, 0, y + 10, [[0, '#7fcf62'], [1, '#4f9e42']]);
  for (const [dx, r] of [[-9, 9], [0, 12], [9, 9]]) { ctx.beginPath(); ctx.arc(x + dx, y, r, 0, TAU); ctx.fill(); }
  for (const dx of [-6, 5]) ell(x + dx, y - 3, 2.2, 2.2, '#ff7a8a');
}
function drawFlowers(x, y, c) {
  for (let i = 0; i < 3; i++) {
    const fx = x + (i - 1) * 7, fy = y + (i % 2) * 5;
    ctx.strokeStyle = '#4f9e42'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy + 7); ctx.stroke();
    for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; ell(fx + Math.cos(a) * 2.6, fy + Math.sin(a) * 2.6, 2.2, 2.2, c); }
    ell(fx, fy, 1.6, 1.6, '#ffd54a');
  }
}
function drawMushroom(x, y) {
  ell(x, y + 7, 7, 2.5, 'rgba(40,80,30,.2)');
  ctx.fillStyle = '#fff3e0'; rrect(x - 3, y - 1, 6, 8, 2); ctx.fill();
  ctx.fillStyle = '#ff6b5e'; ctx.beginPath(); ctx.ellipse(x, y, 9, 7, 0, Math.PI, 0); ctx.fill();
  for (const [dx, dy] of [[-4, -3], [3, -4], [0, -1]]) ell(x + dx, y + dy, 1.4, 1.2, '#fff');
}

function drawPath() {
  // Grass with tufts, then the sandy path with soft edges and pebbles.
  ctx.fillStyle = lin(0, LANE_TOP, 0, LANE_BOT, [[0, '#b6e49a'], [1, '#86cc6e']]); ctx.fillRect(0, LANE_TOP, MID, LANE_BOT - LANE_TOP);
  const step = 26, first = Math.floor((dist - (LANE_BOT - LANE_TOP)) / step) - 1;
  for (let i = first; i <= first + 26; i++) {
    const y = LANE_TOP + dist - i * step;
    for (const side of [0, 1]) {
      const x = side ? 152 + hash(i * 3 + 1) * 20 : 6 + hash(i * 3 + 2) * 22;
      ctx.strokeStyle = 'rgba(70,140,60,.45)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(x - 3, y + 3); ctx.lineTo(x - 1, y - 3); ctx.moveTo(x, y + 3); ctx.lineTo(x, y - 4); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + 1, y - 3); ctx.stroke();
    }
  }
  ctx.fillStyle = lin(34, 0, 146, 0, [[0, '#d9b47e'], [.08, '#ecd2a2'], [.5, '#f4dfb4'], [.92, '#ecd2a2'], [1, '#d9b47e']]);
  ctx.fillRect(36, LANE_TOP, 108, LANE_BOT - LANE_TOP);
  ctx.fillStyle = 'rgba(120,170,80,.5)'; ctx.fillRect(34, LANE_TOP, 3, LANE_BOT - LANE_TOP); ctx.fillRect(143, LANE_TOP, 3, LANE_BOT - LANE_TOP);
  const pstep = 34, pfirst = Math.floor((dist - (LANE_BOT - LANE_TOP)) / pstep) - 1;
  for (let i = pfirst; i <= pfirst + 18; i++) {
    const y = LANE_TOP + dist - i * pstep, x = 46 + hash(i * 7) * 88, r = 1.6 + hash(i * 7 + 1) * 2.2;
    ell(x + .8, y + 1, r, r * .7, 'rgba(150,110,60,.25)'); ell(x, y, r, r * .75, hash(i) > .5 ? '#d6c3a0' : '#c9b38c');
  }
}

function drawScenery() {
  // Trees, bushes, flowers, and mushrooms on the verges, scrolling with the path.
  const step = 64, first = Math.floor((dist - (LANE_BOT - LANE_TOP) - 60) / step);
  for (let i = first; i <= first + 12; i++) {
    const y = LANE_TOP + dist - i * step, h = hash(i * 13 + 5), left = hash(i * 13 + 9) < .5;
    const x = left ? 12 : 168;
    if (h < .35) drawTree(x + (left ? -4 : 4), y, .95);
    else if (h < .6) drawBush(x, y);
    else if (h < .85) drawFlowers(x, y, hash(i) < .5 ? '#ff9fb8' : '#b9a6ff');
    else drawMushroom(x, y);
  }
}

function drawLog(l) {
  const y = LANE_TOP + (el - l.t0) * l.v, x0 = 40, x1 = 140, h = 26;
  ell(92, y + 15, 52, 6, 'rgba(90,60,30,.25)');
  ctx.fillStyle = lin(0, y - h / 2, 0, y + h / 2, [[0, '#c98a50'], [.35, '#a36a3a'], [.8, '#7a4a26'], [1, '#5e3a1e']]);
  rrect(x0, y - h / 2, x1 - x0, h, h / 2); ctx.fill();
  // Bark grooves roll round as the log rolls down.
  const roll = ((el - l.t0) * l.v / 30) % 1;
  for (let k = 0; k < 4; k++) {
    const u = (roll + k / 4) % 1, gy = y - h / 2 + u * h, a = Math.sin(u * Math.PI) * .45;
    ctx.strokeStyle = `rgba(60,35,15,${a})`; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x0 + 12, gy); ctx.bezierCurveTo(x0 + 40, gy + 1.5, x1 - 40, gy - 1.5, x1 - 6, gy); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,230,190,.22)'; rrect(x0 + 10, y - h / 2 + 3, x1 - x0 - 24, 4, 2); ctx.fill();
  // The cut end, with rings.
  ell(x0 + 4, y, 8, h / 2, '#e8c08a');
  ctx.strokeStyle = '#b8834c'; ctx.lineWidth = 1;
  for (const r of [.3, .6, .85]) { ctx.beginPath(); ctx.ellipse(x0 + 4, y, 8 * r, h / 2 * r, 0, 0, TAU); ctx.stroke(); }
  ell(x0 + 4, y, 1.4, 1.8, '#9a6a3a');
  // A little leaf on top.
  ell(x1 - 28, y - h / 2 + 1, 5, 2.4, '#6cc04f', -.4);
}

function drawBunny(x, groundY, h) {
  const air = h > 3, sinceLand = el - (hopT + HOP_TIME);
  let sx = 1, sy = 1;
  if (air) { const u = (el - hopT) / HOP_TIME; sy = 1 + .12 * Math.cos(u * Math.PI); sx = 1 / sy; }
  else if (sinceLand >= 0 && sinceLand < .16) { const q = 1 - sinceLand / .16; sy = 1 - .16 * q; sx = 1 + .14 * q; }
  // Shadow, smaller the higher it hops.
  const shr = 1 - h / (HOP_H * 1.6);
  ell(x, groundY + 20, 22 * shr, 6 * shr, 'rgba(70,60,30,.28)');
  ctx.save(); ctx.translate(x, groundY + 18 - h); ctx.scale(sx * 1.2, sy * 1.2); ctx.translate(0, -18);
  const fur = rad(-6, -6, 2, 0, 2, 24, [[0, '#ffffff'], [.7, '#f6f3f8'], [1, '#e3dceb']]);
  // Feet and tail.
  ell(-9, 15, 6.5, 3.6, '#efe9f3'); ell(9, 15, 6.5, 3.6, '#efe9f3');
  // Ears, swaying back as it rises.
  const ear = air ? -.12 : .05 * Math.sin(T * 3);
  for (const sg of [-1, 1]) {
    ctx.save(); ctx.translate(sg * 6, -12); ctx.rotate(sg * (.16 + ear));
    ell(0, -12, 5.2, 14, '#f8f5fa'); ell(0, -11, 2.6, 10, lin(0, -20, 0, -2, [[0, '#ffb3c4'], [1, '#ffd9e2']]));
    ctx.restore();
  }
  ell(0, 4, 16, 14, fur);
  ell(0, 8, 9, 7, 'rgba(255,255,255,.9)');
  ell(0, -4, 13, 11.5, fur);
  // Face.
  for (const sg of [-1, 1]) {
    ell(sg * 5, -5, 2.4, 2.8, '#2a1a24');
    ell(sg * 5 + .8, -6, .9, .9, '#ffffff'); ell(sg * 5 - .6, -4, .45, .45, '#ffffff');
    ell(sg * 8.4, -.6, 2.8, 1.8, 'rgba(255,140,170,.45)');
  }
  ell(0, -1.4, 1.8, 1.3, '#ff8fa8');
  ctx.strokeStyle = '#8a5a6a'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.moveTo(-2, .6); ctx.quadraticCurveTo(-1, 1.6, 0, .6); ctx.quadraticCurveTo(1, 1.6, 2, .6); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,130,150,.6)'; ctx.lineWidth = .6;
  for (const sg of [-1, 1]) for (const dy of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sg * 3, -.5); ctx.lineTo(sg * 11, -.5 + dy * 1.8); ctx.stroke(); }
  ctx.restore();
}

function drawLeft() {
  ctx.save(); ctx.beginPath(); ctx.rect(0, LANE_TOP, MID - 3, LANE_BOT - LANE_TOP); ctx.clip();
  drawPath();
  drawScenery();
  for (const l of logs) if (!l.hit) drawLog(l);
  // Landing dust.
  const sinceLand = el - (hopT + HOP_TIME);
  if (sinceLand >= 0 && sinceLand < .35) {
    const u = sinceLand / .35;
    for (const sg of [-1, 1]) for (let k = 0; k < 3; k++) ell(BUNNY_X + sg * (14 + u * 18 + k * 5), BUNNY_Y + 18 - k * 2 - u * 4, 3.5 * (1 - u) + .5, 3 * (1 - u) + .5, `rgba(220,195,150,${.7 * (1 - u)})`);
  }
  const blink = el < safeUntil && Math.floor(T * 12) % 2 === 0;
  if (!blink) drawBunny(BUNNY_X, BUNNY_Y, bunnyHeight());
  // Soft light from the top.
  ctx.fillStyle = lin(0, LANE_TOP, 0, LANE_TOP + 60, [[0, 'rgba(255,255,230,.35)'], [1, 'rgba(255,255,230,0)']]); ctx.fillRect(0, LANE_TOP, MID, 60);
  ctx.restore();
}

// ----- right lane: an orchard
function drawApple(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const body = rad(-5, -4, 1, 0, 2, 15, [[0, '#ff9a8a'], [.35, '#f0463f'], [1, '#b3202a']]);
  ell(-5, 2, 11, 12, body); ell(5, 2, 11, 12, body);
  ell(0, -8, 4, 2, 'rgba(120,20,20,.35)');
  ell(-5, -3, 3.5, 5, 'rgba(255,255,255,.45)', .5);
  ctx.strokeStyle = '#6a4024'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, -8); ctx.quadraticCurveTo(1, -13, 2, -16); ctx.stroke();
  ctx.fillStyle = lin(2, -18, 12, -12, [[0, '#8be36a'], [1, '#3f9e3a']]);
  ctx.beginPath(); ctx.moveTo(2, -14); ctx.quadraticCurveTo(8, -21, 13, -15); ctx.quadraticCurveTo(8, -11, 2, -14); ctx.fill();
  ctx.strokeStyle = 'rgba(40,100,40,.6)'; ctx.lineWidth = .7; ctx.beginPath(); ctx.moveTo(3, -14); ctx.lineTo(12, -15); ctx.stroke();
  ctx.lineCap = 'butt'; ctx.restore();
}
function drawPear(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const body = rad(-5, -2, 1, 0, 4, 16, [[0, '#f6fa9a'], [.45, '#cfe04a'], [1, '#92ad2c']]);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.bezierCurveTo(7, -14, 6, -4, 11, 3); ctx.bezierCurveTo(15, 11, 8, 17, 0, 17); ctx.bezierCurveTo(-8, 17, -15, 11, -11, 3); ctx.bezierCurveTo(-6, -4, -7, -14, 0, -14); ctx.fill();
  for (const [dx, dy] of [[-4, 6], [3, 9], [6, 2], [-2, 12], [-6, 0]]) ell(dx, dy, .7, .7, 'rgba(120,120,40,.5)');
  ell(-4, 0, 2.6, 5, 'rgba(255,255,255,.45)', .2);
  ctx.strokeStyle = '#6a4024'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, -13); ctx.quadraticCurveTo(1, -18, 3, -20); ctx.stroke();
  ctx.fillStyle = lin(3, -22, 13, -16, [[0, '#8be36a'], [1, '#3f9e3a']]);
  ctx.beginPath(); ctx.moveTo(3, -18); ctx.quadraticCurveTo(9, -25, 14, -19); ctx.quadraticCurveTo(9, -15, 3, -18); ctx.fill();
  ctx.lineCap = 'butt'; ctx.restore();
}
function drawBee(x, y, s, face) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * face, s);
  const flap = .55 + .45 * Math.abs(Math.sin(T * 38));
  ctx.fillStyle = 'rgba(225,245,255,.85)'; ctx.strokeStyle = 'rgba(150,190,220,.8)'; ctx.lineWidth = .8;

function drawFruit(kind, x, y, s = 1, rot = 0, face = 1) {
  if (kind === 'apple') drawApple(x, y, s, rot);
  else if (kind === 'pear') drawPear(x, y, s, rot);
  else drawBee(x, y, s, face);
}

function drawOrchard() {
  ctx.fillStyle = lin(0, LANE_TOP, 0, 470, [[0, '#9fdcff'], [.7, '#d8f2ff'], [1, '#f3fbff']]); ctx.fillRect(MID, LANE_TOP, W - MID, LANE_BOT - LANE_TOP);
  // The sun and drifting clouds.

  for (let k = 0; k < 3; k++) {
    const x = MID - 40 + ((T * (6 + k * 3) + k * 90) % (W - MID + 80)), y = 170 + k * 60;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const [dx, dy, r] of [[0, 0, 11], [12, -4, 13], [25, 0, 10], [12, 4, 10]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, TAU); ctx.fill(); }
  }

  ctx.fillStyle = '#b7e39c'; ctx.beginPath(); ctx.moveTo(MID, 470); ctx.quadraticCurveTo(230, 420, 290, 455); ctx.quadraticCurveTo(330, 430, W, 450); ctx.lineTo(W, LANE_BOT); ctx.lineTo(MID, LANE_BOT); ctx.fill();
  ctx.fillStyle = lin(0, 500, 0, LANE_BOT, [[0, '#9ad681'], [1, '#78c062']]);
  ctx.beginPath(); ctx.moveTo(MID, 520); ctx.quadraticCurveTo(260, 495, W, 515); ctx.lineTo(W, LANE_BOT); ctx.lineTo(MID, LANE_BOT); ctx.fill();
  for (let k = 0; k < 9; k++) { const x = MID + 10 + k * 20 + hash(k) * 8, y = FRUIT_FLOOR - 2 + hash(k + 9) * 6; drawFlowers(x, y, k % 2 ? '#ffffff' : '#ffd1dc'); }
}

function drawCanopy() {
  ctx.fillStyle = '#7a4e2c'; rrect(W - 22, LANE_TOP, 16, 150, 6); ctx.fill();
  ctx.fillStyle = '#8f5c34'; rrect(W - 18, LANE_TOP, 5, 150, 3); ctx.fill();
  const g = rad(250, LANE_TOP, 10, 270, LANE_TOP + 10, 120, [[0, '#7fd462'], [.7, '#5aae48'], [1, '#3f8f3a']]);

  ctx.fillStyle = 'rgba(30,80,30,.25)';
  for (let k = 0; k < 9; k++) { ctx.beginPath(); ctx.arc(MID + 4 + k * 22, LANE_TOP + 26 + (k % 2) * 8, 10, 0, Math.PI); ctx.fill(); }
  for (let k = 0; k < 5; k++) ell(MID + 20 + k * 36, LANE_TOP + 4 + (k % 2) * 7, 5, 3, 'rgba(255,255,255,.18)', -.4);

function drawSign() {
  // A wooden sign hanging from the branches; it swings when the target changes.
  const target = targetAt(el), since = el - switchAt, fresh = since < 1.6 || T - signFlash < .9;
  const swing = since < 1.6 ? Math.sin(since * 9) * .14 * (1 - since / 1.6) : T - signFlash < .9 ? Math.sin((T - signFlash) * 18) * .08 : Math.sin(T * 1.3) * .015;
  ctx.save(); ctx.translate(271, LANE_TOP + 22); ctx.rotate(swing);

  ctx.beginPath(); ctx.moveTo(-40, -6); ctx.lineTo(-40, 18); ctx.moveTo(40, -6); ctx.lineTo(40, 18); ctx.stroke();
  if (fresh) { ctx.fillStyle = `rgba(255,220,90,${.5 + .3 * Math.sin(T * 14)})`; rrect(-70, 10, 140, 50, 16); ctx.fill(); }
  ctx.fillStyle = 'rgba(70,40,20,.25)'; rrect(-62, 18, 124, 40, 10); ctx.fill();
  ctx.fillStyle = lin(0, 14, 0, 54, [[0, '#f1cf98'], [1, '#d9a866']]); rrect(-62, 14, 124, 40, 10); ctx.fill();
  ctx.strokeStyle = '#b8834c'; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.restore();
}

function drawRight() {
  ctx.save(); ctx.beginPath(); ctx.rect(MID + 3, LANE_TOP, W - MID - 3, LANE_BOT - LANE_TOP); ctx.clip();

    const p = itemPos(f), u = Math.max(0, Math.min(1, (p[1] - 300) / (FRUIT_FLOOR - 300)));

    ctx.fillStyle = 'rgba(70,40,20,.2)'; rrect(-78, -62, 156, 132, 22); ctx.fill();
    ctx.fillStyle = lin(0, -66, 0, 62, [[0, '#fffbe8'], [1, '#ffeec2']]); rrect(-78, -66, 156, 132, 22); ctx.fill();
    ctx.strokeStyle = '#ff9a2a'; ctx.lineWidth = 3; ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#7a4a1e'; ctx.font = '800 15px "Trebuchet MS", system-ui, sans-serif';
    ctx.fillText('Now pop the', 0, -40);

    ctx.fillStyle = target === 'pear' ? '#7a9a1e' : '#d8302c'; ctx.font = '900 22px "Trebuchet MS", system-ui, sans-serif';

}

function drawEffects() {
  for (const p of pops) {
    const u = (T - p.t) / .55; if (u > 1) continue;
    const col = p.kind === 'pear' ? '200,220,70' : '255,100,90';
    ctx.strokeStyle = `rgba(${col},${1 - u})`; ctx.lineWidth = 3 * (1 - u) + .5; ctx.beginPath(); ctx.arc(p.x, p.y, 8 + u * 22, 0, TAU); ctx.stroke();

  }

    for (let j = 0; j < 6; j++) { const a = j / 6 * TAU, r = 4 + u * 16; ell(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r - u * 6, 5 * (1 - u) + 1, 5 * (1 - u) + 1, `rgba(255,255,255,${.9 * (1 - u)})`); }

  if (full) ell(x - r * .45, y - r * .35, r * .28, r * .18, 'rgba(255,255,255,.7)', -.6);
}

function drawHud() {
  ctx.fillStyle = lin(0, 0, 0, LANE_TOP, [[0, '#fffdf3'], [1, '#f3f9e8']]); ctx.fillRect(0, 0, W, LANE_TOP);
  ctx.fillStyle = 'rgba(60,100,40,.12)'; ctx.fillRect(0, LANE_TOP - 2, W, 2);
  ctx.fillStyle = '#ff8c2a'; ctx.font = '800 13px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center';

  ctx.fillStyle = lin(0, 28, 0, 66, [[0, '#ffffff'], [1, '#eaf6df']]); rrect(132, 28, 96, 38, 19); ctx.fill();
  ctx.strokeStyle = 'rgba(95,180,80,.45)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = '#3f7a35'; ctx.font = '800 26px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText(String(score), 180, 56);

    ctx.fillStyle = '#5f8a55'; ctx.font = '700 12px system-ui, sans-serif'; ctx.fillText(`${Math.floor(el)} s`, 318, 51.5);
  }

  ctx.fillStyle = lin(MID - 4, 0, MID + 4, 0, [[0, '#a87a4c'], [.5, '#c99a64'], [1, '#8a5e36']]); ctx.fillRect(MID - 3, LANE_TOP, 6, LANE_BOT - LANE_TOP);
  for (let y = LANE_TOP + 14; y < LANE_BOT; y += 36) { ell(MID - 6, y, 5, 2.6, '#6cc04f', -.6); ell(MID + 6, y + 18, 5, 2.6, '#5aae48', .6); }
}

function drawFoot() {
  ctx.fillStyle = lin(0, LANE_BOT, 0, H, [[0, '#f3f9e8'], [1, '#fffdf3']]); ctx.fillRect(0, LANE_BOT, W, H - LANE_BOT);
  ctx.fillStyle = 'rgba(60,100,40,.12)'; ctx.fillRect(0, LANE_BOT, W, 2);
  ctx.textAlign = 'center';
  if (state === 'play' && T - whyAt < 1.6 && why) {
    ctx.fillStyle = 'rgba(240,90,70,.12)'; rrect(40, LANE_BOT + 8, 280, 26, 13); ctx.fill();
    ctx.fillStyle = '#d9483a'; ctx.font = '700 14px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText(why, 180, LANE_BOT + 26);
  } else if (state === 'play') {
    for (const [x, label, icon] of [[90, 'tap to hop', 'bunny'], [270, 'tap the fruit', 'fruit']]) {
      ctx.fillStyle = 'rgba(95,180,80,.13)'; rrect(x - 66, LANE_BOT + 8, 132, 26, 13); ctx.fill();
      ctx.fillStyle = '#5f8a55'; ctx.font = '700 12px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText(label, x + 9, LANE_BOT + 25);
      if (icon === 'fruit') drawApple(x - 44, LANE_BOT + 21, .5, 0);
      else { ell(x - 44, LANE_BOT + 22, 6, 5, '#ffffff'); ell(x - 47, LANE_BOT + 15, 1.8, 5, '#ffffff'); ell(x - 41, LANE_BOT + 15, 1.8, 5, '#ffffff'); ell(x - 44, LANE_BOT + 21, 1, 1, '#ff8fa8'); }
    }

}

function button(x, y, w, h, label) {
  ctx.fillStyle = '#3f9e62'; rrect(x, y + 5, w, h, 26); ctx.fill();
  ctx.fillStyle = lin(0, y, 0, y + h, [[0, '#74d394'], [1, '#4fb874']]); rrect(x, y, w, h, 26); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; rrect(x + 5, y + 4, w - 10, h * .4, 20); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 20px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

let btnY = 0;
function card(title, lines, btn, note, y0) {
  const h = 76 + lines.length * 22 + 74 + (note ? 18 : 0);
  ctx.fillStyle = 'rgba(250,255,240,.72)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(60,100,50,.18)'; rrect(26, y0 + 8, 308, h, 26); ctx.fill();
  ctx.fillStyle = lin(0, y0, 0, y0 + h, [[0, '#fffef8'], [1, '#f6fbea']]); rrect(26, y0, 308, h, 26); ctx.fill();
  ctx.strokeStyle = 'rgba(255,140,42,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  // A bunny and an apple peeking over the card.
  drawApple(296, y0 + 4, .9, .2);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ff8c2a'; ctx.font = '800 28px "Trebuchet MS", system-ui, sans-serif'; ctx.fillText(title, 180, y0 + 44);
  ctx.fillStyle = '#4a5a4a'; ctx.font = '14px system-ui, sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, 180, y0 + 76 + i * 22));
  btnY = y0 + 76 + lines.length * 22;
  button(80, btnY, 200, 56, btn);

}

// ---------- sound
let AC = null, master = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination);
}
function tone(f, when, dur, vol, type = 'sine', to = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, when);
  if (to) o.frequency.exponentialRampToValueAtTime(to, when + dur);
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + .012); g.gain.exponentialRampToValueAtTime(.0005, when + dur);
  o.connect(g); g.connect(master); o.start(when); o.stop(when + dur + .05);
}
function sHop() { if (AC) tone(300, AC.currentTime, .22, .1, 'sine', 620); }
function sPop() { if (AC) { const t = AC.currentTime; tone(900, t, .08, .1, 'triangle', 1400); tone(1600, t + .03, .1, .04); } }
function sLose() { if (AC) tone(240, AC.currentTime, .3, .12, 'triangle', 140); }
function sSwitch() { if (AC) { const t = AC.currentTime; tone(660, t, .2, .06, 'triangle'); tone(880, t + .12, .25, .06, 'triangle'); } }
function sEnd() { if (AC) { const t = AC.currentTime; [784, 659, 523].forEach((f, i) => tone(f, t + i * .14, .4, .08, 'triangle')); } }
function sClick() { if (AC) tone(880, AC.currentTime, .04, .05, 'triangle'); }

// ---------- input
function pagePos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = pagePos(e);
  audio();
  if (state === 'intro' || state === 'over') {
    if (x >= 80 && x <= 280 && y >= btnY && y <= btnY + 56) { sClick(); startRun(); }
    return;
  }
  if (y < LANE_TOP) return;
  if (x < MID) hop(); else tapRight(x, y);
});
addEventListener('keydown', e => {
  if ((state === 'intro' || state === 'over') && (e.key === 'Enter' || e.key === ' ')) { audio(); startRun(); return; }
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { audio(); hop(); e.preventDefault(); }
});

// ---------- frame
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  update(dt);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  drawLeft(); drawRight(); drawEffects(); drawHud(); drawFoot();
  if (state === 'intro') card('Hop & Pop', ['Two games at once!', 'Left: tap to hop the bunny over the logs.', 'Right: pop the fruit on the sign before it', 'lands. Leave the other fruit and the bees.', 'Watch the sign: it changes!'], "Let's go", 'draft 3  ·  sound on', 150);
  if (state === 'over') card('No hearts left!', [why, `Score: ${score}   ·   ` + (score >= best && score > 0 ? 'a new best!' : `best ${best}`), `You lasted ${Math.floor(el)} seconds.`], 'Play again', '', 190);
  requestAnimationFrame(frame);
}

// ---------- test and screenshot hooks
if (Q.get('t')) { startRun(); const until = Number(Q.get('t')); const auto = Q.has('auto'); lives = 99; while (el < until) { if (auto) autoPlay(); update(1 / 60); T += 1 / 60; } lives = Math.min(lives, LIVES); }

// A perfect player, for tests: hops when a log is close, pops targets.
function autoPlay() {
  for (const l of logs) { const y = LANE_TOP + (el - l.t0) * l.v; if (!l.hopped && !l.hit && y > BUNNY_Y - 14 - l.v * HOP_TIME * .45 && y < BUNNY_Y - 14) hop(); }
  for (const f of items) { if (!f.done && f.kind === targetAt(el) && itemPos(f)[1] > 300) { const p = itemPos(f); tapRight(p[0], p[1]); } }
}
window.__hp = { get why() { return why; }, get switchAt() { return switchAt; }, startRun, update, hop, tapRight, autoPlay, itemPos, logArrival, fruitLanding, targetAt, logSpeed, fruitSpeed, GAP,
  get state() { return state; }, get lives() { return lives; }, set lives(v) { lives = v; }, get score() { return score; }, get el() { return el; },
  get logs() { return logs; }, get items() { return items; }, setRnd: f => rnd = f };
requestAnimationFrame(frame);
